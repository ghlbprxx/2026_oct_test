<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Pink Oyster Run</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a grower's lab notebook on graph paper. Sticky tab strip; each tab is one tool (guide, drill, simulator, cheat sheet). Simulator = decision column + live vessel rail. */
:root{
  --bg:#f2eef4; --grid:#e4dce8; --panel:#fcfbfd; --ink:#2a1b2e; --muted:#6c5c72; --line:#ddd2e2;
  --pink:#e2557a; --pink-deep:#b8325a; --pink-soft:#fbdde6; --gill:#fde9ee;
  --myc:#fbf8f1; --agar:#ead7a8; --broth:#e9c98a; --grain:#a9763f; --straw:#d9b65a; --dust:#8a6040;
  --trich:#2f9b55; --trich-dark:#14633a; --cooked:#b68a5e;
  --good:#2b8a5d; --good-soft:#dcf0e5; --warn:#b07316; --warn-soft:#f8ecd2; --bad:#c0392b; --bad-soft:#f8dcd8;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#18111a; --grid:#221a25; --panel:#221925; --ink:#f3eaf4; --muted:#b3a3b8; --line:#3a2d3f;
  --pink:#ff7a9c; --pink-deep:#e2557a; --pink-soft:#4a2132; --gill:#ffd6e1;
  --myc:#eee8dc; --agar:#8a7444; --broth:#8f733f; --grain:#8a5f33; --straw:#a88a3c; --dust:#6b4a31;
  --trich:#45b56d; --trich-dark:#1f7a47; --cooked:#a07a52;
  --good:#5cc995; --good-soft:#173528; --warn:#e2ac52; --warn-soft:#3a2c14; --bad:#ff7a6b; --bad-soft:#3e1d1a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#18111a; --grid:#221a25; --panel:#221925; --ink:#f3eaf4; --muted:#b3a3b8; --line:#3a2d3f;
  --pink:#ff7a9c; --pink-deep:#e2557a; --pink-soft:#4a2132; --gill:#ffd6e1;
  --myc:#eee8dc; --agar:#8a7444; --broth:#8f733f; --grain:#8a5f33; --straw:#a88a3c; --dust:#6b4a31;
  --trich:#45b56d; --trich-dark:#1f7a47; --cooked:#a07a52;
  --good:#5cc995; --good-soft:#173528; --warn:#e2ac52; --warn-soft:#3a2c14; --bad:#ff7a6b; --bad-soft:#3e1d1a;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1120px;margin:0 auto}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.stack{display:grid;gap:14px}
section.tab{display:grid;gap:22px;padding-top:22px}

/* top */
.masthead{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;justify-content:space-between;padding-top:20px}
.masthead .logo{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em}
.masthead .logo em{font-style:normal;color:var(--pink)}
.masthead .species{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;overflow-x:auto;padding-block:10px;border-bottom:1px solid var(--line);margin-top:10px}
.tabs button{flex:0 0 auto;border:1.5px solid transparent;background:transparent;border-radius:999px;padding:7px 15px;font-family:var(--display);font-weight:600;font-size:15px;color:var(--muted);display:flex;gap:8px;align-items:center}
.tabs button .n{font-family:var(--mono);font-size:11px;opacity:.75}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px}
.btn{padding:11px 18px;border-radius:9px;border:none;background:var(--pink);color:#fff;font-weight:700;font-family:var(--display);font-size:16px}
.btn:hover{background:var(--pink-deep)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--pink)}
.btn.sm{padding:7px 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;font-weight:600;white-space:nowrap}
.chip.best,.chip.good{background:var(--good);color:var(--panel)}
.chip.ok{background:var(--warn);color:var(--panel)}
.chip.bad{background:var(--bad);color:var(--panel)}
.chip.plain{background:var(--line);color:var(--ink)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:24px;align-items:center}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero h1{font-size:clamp(36px,6.2vw,66px);font-weight:800;letter-spacing:-.025em}
.hero h1 span{color:var(--pink)}
.hero .lede{font-size:18px;max-width:52ch;margin-top:14px}
.hero .art{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px;display:grid;gap:8px}
.toggle{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;padding:3px;gap:2px;justify-self:center}
.toggle button{border:none;background:transparent;border-radius:999px;padding:5px 14px;font-family:var(--mono);font-size:12px}
.toggle button[aria-pressed="true"]{background:var(--pink);color:#fff}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:20px}
@media (max-width:620px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fact{border-left:3px solid var(--pink);padding:2px 0 2px 10px}
.fact b{display:block;font-family:var(--mono);font-size:20px;font-weight:600}
.fact span{font-size:13px;color:var(--muted)}

/* pipeline */
.pipeline{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:720px){.pipeline{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pnode{position:relative;display:grid;justify-items:center;gap:4px;padding:12px 6px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);text-align:center}
.pnode:hover{border-color:var(--pink)}
.pnode[aria-pressed="true"]{border-color:var(--pink);background:var(--pink-soft)}
.pnode svg{width:44px;height:44px}
.pnode b{font-family:var(--display);font-size:14.5px}
.pnode .mono{font-size:10.5px;color:var(--muted)}
.ico .s{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico .f{fill:var(--pink)} .ico .m{fill:var(--myc);stroke:var(--ink);stroke-width:1.2} .ico .a{fill:var(--agar)}

.stagepanel{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:820px){.stagepanel{grid-template-columns:minmax(0,1fr)}}
.stagepanel h2{font-size:clamp(26px,3.6vw,36px)}
.target{background:var(--pink-soft);border-radius:10px;padding:12px 14px}
.picks{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:p}
.picks li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start}
.picks li::before{counter-increment:p;content:counter(p);font-family:var(--mono);font-size:13px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line)}
.picks b{font-family:var(--display)}
.mist{display:grid;gap:10px}
.mistake{border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:8px;padding:11px 13px;background:var(--panel);display:grid;gap:4px}
.mistake h4{font-size:16.5px}
.mistake .fix{font-size:14.5px}
.mistake .fix b{color:var(--good)}
.mistake .why{font-size:14.5px;color:var(--muted)}
.addrow{display:flex;flex-wrap:wrap;gap:8px}
.add{border:1px dashed var(--line);border-radius:8px;padding:6px 10px;font-size:13.5px}
.add b{font-family:var(--mono);font-size:12.5px}

/* chart */
.chartwrap{overflow-x:auto}
.chartwrap svg{width:100%;min-width:520px;height:auto;display:block}
.ch-axis{stroke:var(--muted);stroke-width:1}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-yield{fill:none;stroke:var(--pink);stroke-width:3}
.ch-risk{fill:none;stroke:var(--trich);stroke-width:3;stroke-dasharray:7 5}
.ch-zone{fill:var(--warn-soft);opacity:.7}
.ch-t{fill:var(--muted);font-family:var(--mono);font-size:11px}
.ch-tb{fill:var(--ink);font-family:var(--body);font-size:12.5px;font-weight:700}
.ch-dot{fill:var(--panel);stroke:var(--pink);stroke-width:2.5}
.ch-lab-y{fill:var(--pink-deep);font-family:var(--mono);font-size:12px;font-weight:600}
.ch-lab-r{fill:var(--trich-dark);font-family:var(--mono);font-size:12px;font-weight:600}

/* cases */
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:13.5px}
.filters button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.case{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px;align-content:start}
.case .see{font-family:var(--display);font-size:17.5px;font-weight:600;text-wrap:pretty}
.case .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.copts{display:grid;gap:6px}
.copt{text-align:left;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);padding:8px 10px;font-size:14.5px}
.copt:hover:not(:disabled){border-color:var(--pink)}
.copt:disabled{cursor:default}
.copt.right{border-color:var(--good);background:var(--good-soft)}
.copt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.copt.fade{opacity:.5}
.reveal{border-top:1px dashed var(--line);padding-top:10px;font-size:14.5px;display:grid;gap:4px}
.reveal b{color:var(--good)}
.score{font-family:var(--mono);font-size:13px}
.myth{font-family:var(--display);font-size:clamp(21px,3vw,27px);font-weight:600;text-wrap:balance}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:420px}
.tf .btn{font-size:18px;padding:14px}

/* sim */
.simgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media (max-width:880px){.simgrid{grid-template-columns:minmax(0,1fr)}.rail{order:-1}}
.track{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.track .node{flex:1 0 84px;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--panel);font-family:var(--mono);font-size:11px;color:var(--muted)}
.track .node b{display:block;font-family:var(--display);font-size:14px;color:var(--ink)}
.track .node.now{border-color:var(--pink);box-shadow:inset 0 -3px 0 var(--pink)}
.track .node.done{background:var(--pink-soft);border-color:transparent}
.stagehead{display:grid;gap:6px;margin-bottom:14px}
.stagehead h2{font-size:clamp(24px,3.4vw,32px)}
.q{font-family:var(--display);font-size:20px;font-weight:600;margin:2px 0 14px;text-wrap:balance}
.event{background:var(--warn-soft);border-left:4px solid var(--warn);padding:10px 14px;border-radius:6px;margin-bottom:12px;display:grid;gap:2px}
.opts{display:grid;gap:9px}
.opt{text-align:left;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);transition:border-color .15s,transform .15s}
.opt:hover:not(:disabled){border-color:var(--pink);transform:translateX(2px)}
.opt:disabled{cursor:default}
.opt .key{flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);font-family:var(--mono);font-size:12px}
.opt .txt{min-width:0}
.opt small{display:block;color:var(--muted);font-size:13.5px;margin-top:2px}
.opt.picked.best,.opt.picked.good{border-color:var(--good);background:var(--good-soft)}
.opt.picked.ok{border-color:var(--warn);background:var(--warn-soft)}
.opt.picked.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.dim{opacity:.5}
.verdict{margin-top:14px;padding:13px 15px;border-radius:9px;display:grid;gap:6px}
.verdict.best,.verdict.good{background:var(--good-soft)}
.verdict.ok{background:var(--warn-soft)}
.verdict.bad{background:var(--bad-soft)}
.fx{font-family:var(--mono);font-size:12.5px;display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted)}
.fx .up{color:var(--good)} .fx .dn{color:var(--bad)}
.rail{display:grid;gap:14px}
.vessel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:6px}
canvas.vc{width:100%;height:auto;display:block;border-radius:8px}
.vessel .cap{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center}
.meters{display:grid;gap:13px}
.meter .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14.5px}
.meter .row b{font-family:var(--mono);font-size:14px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:99px;transition:width .5s ease}
.env{display:grid;gap:16px}
.slider{display:grid;gap:6px}
.slider .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.slider label{font-weight:700}
.slider input{width:100%;accent-color:var(--pink)}
.slider .hint{font-size:13.5px;color:var(--muted)}
.blocks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.blk{border:1.5px solid var(--line);border-radius:10px;padding:6px;background:var(--bg);display:grid;gap:4px;text-align:center}
.blk.clean{border-color:var(--good)} .blk.contam{border-color:var(--bad)}
.blk .mono{font-size:11.5px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--bg)}
.stat b{display:block;font-family:var(--mono);font-size:21px;font-variant-numeric:tabular-nums}
.rank{font-family:var(--display);font-size:clamp(30px,4.8vw,44px);font-weight:800;color:var(--pink)}
.log{margin:0;padding:0;list-style:none;display:grid;gap:7px;font-size:14.5px}
.log li{display:flex;gap:10px;align-items:baseline}
.review{display:grid;gap:10px}
.brief{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:620px){.brief{grid-template-columns:minmax(0,1fr)}}
.brief div{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--bg)}
.brief b{font-family:var(--display);font-size:18px;display:block}

/* cheat sheet */
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.num{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.num b{display:block;font-family:var(--mono);font-size:21px;color:var(--pink-deep);font-weight:600;font-variant-numeric:tabular-nums}
.num span{font-size:13px;color:var(--muted)}
.tblwrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--line)}
th{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
td b{font-family:var(--display)}
tr:last-child td{border-bottom:none}
td ul{margin:0;padding-left:16px}
.ok-t{color:var(--good);font-weight:700} .no-t{color:var(--bad);font-weight:700}
.myths2{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.m2{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:14.5px;display:grid;gap:3px}
.m2 s{color:var(--muted)}
/* v3 UX additions */
.tabs .badge{font-family:var(--mono);font-size:10.5px;padding:1px 7px;border-radius:99px;background:var(--line);color:var(--ink)}
.tabs button[aria-selected="true"] .badge{background:var(--pink);color:#fff}
.tabs .badge.done{background:var(--good);color:var(--panel)}
.path{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:720px){.path{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pstep{text-align:left;border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:12px;display:grid;gap:7px;align-content:start}
.pstep:hover{border-color:var(--pink)}
.pstep .top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.pstep b{font-family:var(--display);font-size:15.5px}
.pstep .mono{font-size:12px;color:var(--muted)}
.tick{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;flex:0 0 auto}
.tick.on{background:var(--good);border-color:var(--good);color:var(--panel)}
.mini{height:5px;border-radius:99px;background:var(--line);overflow:hidden}
.mini i{display:block;height:100%;background:var(--pink);transition:width .4s ease}
.delta{display:inline-block;margin-right:6px;font-family:var(--mono);font-size:12px;font-weight:600;animation:rise 2.4s ease forwards}
.delta.up{color:var(--good)} .delta.dn{color:var(--bad)}
@keyframes rise{0%{opacity:0;transform:translateY(6px)}12%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
.hintbox{border:1px dashed var(--line);border-radius:9px;padding:8px 12px;margin-bottom:14px;font-size:14.5px}
.hintbox summary{cursor:pointer;font-weight:700;color:var(--pink-deep)}
.hintbox[open]{background:var(--bg)}
.hintbox ul{margin:6px 0 0;padding-left:18px;display:grid;gap:2px}
.kbd{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:12px}
.kbd kbd{font-family:var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--panel);color:var(--ink)}
@media (hover:none){.kbd{display:none}}
.simbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;min-height:34px}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--bad-soft);border-radius:9px;padding:6px 10px;font-size:14.5px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:20;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.search{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search input{flex:1 1 260px;min-width:0;font:inherit;padding:10px 14px;border:1.5px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink)}
.search input:focus{border-color:var(--pink);outline:none}
textarea.copy{width:100%;min-height:96px;font-family:var(--mono);font-size:13px;padding:10px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
.stagenav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:20px;text-align:center;color:var(--muted)}
h2[tabindex="-1"]:focus{outline:none}
@media (max-width:880px){
  .rail{grid-template-columns:minmax(0,170px) minmax(0,1fr);gap:10px;align-items:stretch}
  .rail .card.meters{padding:12px;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 12px;align-content:start}
  .rail .meters>.label{grid-column:1/-1}
  .rail .meter .row{font-size:13px}
  .vessel{padding:6px}
}
@media (max-width:460px){.rail{grid-template-columns:minmax(0,112px) minmax(0,1fr);gap:8px}.rail .vessel .cap{display:none}.rail .card.meters{gap:8px 10px;padding:10px}.rail .meter .row{font-size:12px}.rail .meter .row b{font-size:12.5px}}
footer{margin-top:30px;font-size:12.5px;color:var(--muted);max-width:75ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function rngFrom(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
function fit(cv,W,H){const d=Math.min(2,window.devicePixelRatio||1);cv.width=W*d;cv.height=H*d;const c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);return c}
const reduceMotion = () => !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

function genHyphae(rng, tips, inside, maxSeg){
  const segs=[]; let cur=tips.map(t=>({...t}));
  while(cur.length && segs.length<maxSeg){
    const nxt=[];
    for(const t of cur){
      t.a+=(rng()-.5)*.75;
      const nx=t.x+Math.cos(t.a)*4, ny=t.y+Math.sin(t.a)*4;
      if(!inside(nx,ny)) continue;
      segs.push([t.x,t.y,nx,ny]); t.x=nx; t.y=ny; nxt.push(t);
      if(rng()<.075 && nxt.length<220) nxt.push({x:nx,y:ny,a:t.a+(rng()<.5?-1:1)*(.5+rng()*.6)});
    }
    cur=nxt;
  }
  return segs;
}

  plate:{inside:(x,y)=>Math.hypot(x-160,y-122)<86, tips:r=>Array.from({length:14},(_,i)=>({x:160,y:122,a:i/14*6.283+r()*.3})), glow:[[160,122]], reach:92},

  bag:{inside:(x,y)=>x>94&&x<226&&y>96&&y<212, tips:r=>Array.from({length:10},()=>{const x=100+r()*120,y=102+r()*104;return Array.from({length:4},(_,i)=>({x,y,a:i*1.57+r()}))}).flat(), glow:null, reach:60}

function trich(c,x,y,r){

  g.addColorStop(0,css('--trich-dark'));g.addColorStop(.55,css('--trich'));g.addColorStop(.8,css('--myc'));g.addColorStop(1,'rgba(255,255,255,0)');

}
function drawHyphae(c,segs,frac){
  const n=Math.floor(segs.length*clamp(frac,0,1));
  c.strokeStyle=css('--myc');c.globalAlpha=.6;c.lineWidth=.9;c.beginPath();
  for(let i=0;i<n;i++){const s=segs[i];c.moveTo(s[0],s[1]);c.lineTo(s[2],s[3])}

}

/* cluster: o = {size, stem, dry, pins, cooked, contam, seed, n} */
function drawCluster(c,W,H,o){
  c.clearRect(0,0,W,H);
  const r=rngFrom(o.seed||11), myc=css('--myc'), muted=css('--muted');
  const bx=W*.5, by=H*.62;
  // block
  c.fillStyle='rgba(0,0,0,.08)';c.beginPath();c.ellipse(bx,H-8,W*.26,7,0,0,6.283);c.fill();
  c.fillStyle=myc;c.strokeStyle=muted;c.lineWidth=1.5;rr(c,bx-W*.22,by-12,W*.44,H-12-(by-12),10);c.fill();c.stroke();
  c.strokeStyle='rgba(0,0,0,.06)';c.lineWidth=1;for(let i=0;i<22;i++){const x=bx-W*.2+r()*W*.38,y=by+r()*(H-by-24);c.beginPath();c.moveTo(x,y);c.lineTo(x+6+r()*8,y+r()*3);c.stroke()}
  if(o.contam){for(let i=0;i<4;i++)trich(c,bx-W*.2+r()*W*.4,by+8+r()*H*.28,14+r()*16);return}
  c.strokeStyle=muted;c.lineWidth=2;c.beginPath();c.moveTo(bx-16,by+6);c.lineTo(bx+16,by+6);c.stroke();
  if(o.pins){c.fillStyle=css('--pink');for(let i=0;i<9;i++){c.beginPath();c.arc(bx-14+r()*28,by+2-r()*6,1.6+r()*1.8,0,6.283);c.fill()}return}
  const pink = o.cooked?css('--cooked'):css('--pink'), deep=o.cooked?css('--cooked'):css('--pink-deep'), gill=o.cooked?css('--myc'):css('--gill');
  const n=o.n||7, caps=[];
  for(let i=0;i<n;i++){const f=n===1?.5:i/(n-1);const a=-Math.PI+.18+f*(Math.PI-.36)+(r()-.5)*.2;caps.push({a,k:.7+r()*.45,ph:r()*6,o:Math.abs(f-.5)})}
  caps.sort((p,q)=>p.o-q.o);
  c.fillStyle=gill;c.beginPath();c.ellipse(bx,by-2,o.size*.32,o.size*.22,0,0,6.283);c.fill();
  for(const cp of caps){
    const R=o.size*cp.k, L=(o.stem+o.size*.5)*(.8+cp.o*.6)*(.85+cp.k*.2);
    const sx=bx+Math.cos(cp.a)*L, sy=by+Math.sin(cp.a)*L;
    c.strokeStyle=gill;c.lineWidth=Math.max(4,R*.3);c.lineCap='round';c.beginPath();c.moveTo(bx,by);c.quadraticCurveTo(bx+Math.cos(cp.a)*L*.5,by+Math.sin(cp.a)*L*.6,sx,sy);c.stroke();
    const span=.95, steps=40, amp=o.dry?.16:.07, freq=o.dry?17:9;
    const pts=[];for(let j=0;j<=steps;j++){const th=cp.a-span+j/steps*span*2;const rad=R*(1+amp*Math.sin(th*freq+cp.ph))*(1-.18*Math.abs(j/steps-.5)*2);pts.push([sx+Math.cos(th)*rad,sy+Math.sin(th)*rad*.8])}
    const g=c.createRadialGradient(sx,sy,0,sx,sy,R*1.05);g.addColorStop(0,pink);g.addColorStop(.6,pink);g.addColorStop(1,deep);
    c.fillStyle=g;c.beginPath();c.moveTo(sx,sy);for(const p of pts)c.lineTo(p[0],p[1]);c.closePath();c.fill();
    c.strokeStyle=gill;c.globalAlpha=.55;c.lineWidth=.8;c.beginPath();for(let j=1;j<steps;j+=2){const p=pts[j];c.moveTo(sx,sy);c.lineTo(sx+(p[0]-sx)*.92,sy+(p[1]-sy)*.92)}c.stroke();c.globalAlpha=1;
    if(o.dry){c.strokeStyle=css('--panel');c.lineWidth=1.4;for(let j=4;j<steps;j+=7){const p=pts[j];c.beginPath();c.moveTo(p[0],p[1]);c.lineTo(sx+(p[0]-sx)*.8,sy+(p[1]-sy)*.8);c.stroke()}}
  }
}

/* environment model for fruiting */
function envModel(temp,fae,mist){
  const co2=Math.round(400+4200/(1+fae*1.15));
  const rh=clamp(Math.round(mist-fae*2.2),40,100);
  let tF = temp<64?.08 : temp<70?.4+.6*(temp-64)/6 : temp<=85?1 : temp<=90?1-.05*(temp-85) : .6;
  let cF = co2<=1000?1 : Math.max(.3,1-(co2-1000)/4200);
  let hF = rh>=85&&rh<=95?1 : rh<85?Math.max(.3,1-(85-rh)*.035) : .9;
  const score=tF*cF*hF;
  const extraRisk=(rh>96?6:0)+(temp>90?6:0);
  const vis={pins:temp<64, size:(16+30*tF*hF)*(.45+.55*cF), stem:8+Math.max(0,co2-1000)/55, dry:rh<80};
  return {co2,rh,tF,cF,hF,score,extraRisk,vis};
}
function tStat(t){return t<64?['bad','No pins']:t<70?['ok','Slow']:t<=85?['good','Sweet spot']:t<=90?['ok','Heat stress']:['bad','Too hot']}
function cStat(c){return c<=1000?['good','Fresh']:c<=2000?['ok','Stuffy']:['bad','Leggy stems']}
function hStat(h){return h<75?['bad','Caps cracking']:h<85?['ok','A bit dry']:h<=95?['good','Ideal']:['ok','Soggy, bacterial risk']}

const VesselCanvas = {

  data(){return{shown:0,raf:0,cache:null}},
  mounted(){this.ctx=fit(this.$refs.cv,320,240);this.build();this.loop()},
  unmounted(){cancelAnimationFrame(this.raf)},
  watch:{kind(){this.shown=0;this.build()}},
  methods:{
    build(){
      const r=rngFrom(this.seed*31+this.kind.length);
      const geo=GEO[this.kind];
      const kernMemo={};
      this.cache={seed:this.seed,
        segs: geo?genHyphae(r,geo.tips(r),geo.inside,this.kind==='plate'?5200:4200):[],
        kern:(kr)=>kernMemo[kr]||(kernMemo[kr]=(()=>{const a=[];const rk=rngFrom(9);for(let y=66;y<218;y+=kr*1.4)for(let x=106;x<216;x+=kr*1.9)a.push([x+(rk()-.5)*kr,y+(rk()-.5)*kr,rk()*3]);return a})()),
        straw:Array.from({length:150},()=>[94+r()*134,96+r()*118,r()*6.283]),
        spawn:Array.from({length:9},()=>[102+r()*116,104+r()*100]),
        frag:Array.from({length:30},()=>[r()*6.283,r(),.3+r()*.7,.2+r()*.8])};
    },
    loop(){
      const step=(t)=>{
        const target=this.cover;
        if(reduceMotion()) this.shown=target; else this.shown+=(target-this.shown)*.04;
        drawVessel(this.ctx,this.kind,{cover:this.shown,contam:this.contam,flags:this.flags||{}},this.cache,reduceMotion()?0:t);
        this.raf=requestAnimationFrame(step);
      };
      this.raf=requestAnimationFrame(step);
    }
  }
};

 components:{VesselCanvas,ClusterCanvas,StageIcon,TradeoffChart},

   myths:[], mi:0, mAns:null, mScore:0, mDone:false,
   sim: okSaved?saved:this.newRun(), best:store.get('por-best',null),
   progress: Object.assign({seen:[],myth:null,runs:0}, store.get('por-progress',{})),
   resumed: okSaved && saved.screen!=='brief' && saved.screen!=='report',
   confirmRestart:false, deltas:{}, dk:0, toast:'', toastT:0, copyFallback:'', csQ:''
  };
 },

 },
 watch:{
  sim:{deep:true,handler(v){store.set('por-sim',v)}},

 },

  markSeen(){if(this.tab==='guide'&&!this.progress.seen.includes(this.gStage)){this.progress.seen.push(this.gStage);this.saveProg()}},
  pickStage(id){
   this.gStage=id;
   this.$nextTick(()=>{const el=document.getElementById('stagepanel');if(!el)return;const r=el.getBoundingClientRect();if(r.top<60||r.top>window.innerHeight*.6)el.scrollIntoView({behavior:reduceMotion()?'auto':'smooth',block:'start'})});
  },
  showToast(m){this.toast=m;clearTimeout(this.toastT);this.toastT=setTimeout(()=>{this.toast=''},2400)},
  badge(t){
   if(t==='guide') return this.progress.seen.length+'/6';
   if(t==='cases') return this.answered+'/'+CASES.length;
   if(t==='sim') return this.best!=null?'best '+this.best:(this.sim.screen!=='brief'&&this.sim.screen!=='report'?'in progress':'');
   return '';
  },
  badgeDone(t){return t==='guide'?this.progress.seen.length>=6:t==='cases'?this.answered>=CASES.length:false},
  caseCount(st){const l=CASES.map((c,i)=>i).filter(i=>CASES[i].st===st);return [l.filter(i=>this.caseAns[i]!==undefined).length,l.length]},
  onKey(e){
   if(this.tab!=='sim'||e.metaKey||e.ctrlKey||e.altKey) return;
   const ae=document.activeElement, tag=ae&&ae.tagName||'';
   if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SUMMARY') return;
   const s=this.sim;
   if(s.screen==='step' && !this.curStep.env && s.picked===null && e.key.length===1){
    const k=e.key.toLowerCase(); let i='abcdefg'.indexOf(k); if(i<0) i='1234567'.indexOf(k);
    if(i>=0 && i<this.curStep.opts.length){e.preventDefault();this.choose(i);return}
   }
   if(e.key==='Enter' && tag!=='BUTTON'){
    if(s.screen==='brief'){e.preventDefault();this.simStart()}
    else if(s.screen==='step'&&s.picked!==null){e.preventDefault();this.next()}
   }
  },

  },

  csItems(arr){if(!this.csQ.trim())return arr.slice(0,3);const f=arr.filter(a=>this.csMatch(a.join(' ')));return f.length?f:arr.slice(0,3)},
  study(st){this.gStage=st;this.go('guide');this.$nextTick(()=>{const el=document.getElementById('stagepanel');el&&el.scrollIntoView({behavior:reduceMotion()?'auto':'smooth',block:'start'})})},

  /* sim */
  newRun(){
   const seed=Math.floor(Math.random()*1e9), r=rngFrom(seed);
   const steps=SIM.map(s=>[...s.fixed, ...(s.pool.length?[s.pool[Math.floor(r()*s.pool.length)]]:[])].map(st=>st.env?st:{...st,opts:shuffle(st.opts,r)}));
   const season=SEASONS[Math.floor(r()*SEASONS.length)];
   return {v:3, hints:[], seed, steps, season, screen:'brief', si:0, qi:0, picked:null, vig:50, risk:6, be:40, sell:1,
     flags:{stir:2}, log:[], env:{temp:season.temp, fae:0, mist:80}, envDone:false, envScore:1, blocks:[], rolled:false};
  },
  restart(){this.sim=this.newRun();this.confirmRestart=false;this.resumed=false;this.copyFallback='';window.scrollTo({top:0})},
  simStart(){this.sim.screen='step';this.focusStage()},
  choose(i){
   const s=this.sim; if(s.picked!==null) return;
   s.picked=i; const o=this.curStep.opts[i], f=o.fx||{};
   s.vig=clamp(s.vig+(f.vig||0),0,100); s.risk=clamp(s.risk+(f.risk||0),2,95); s.be=clamp(s.be+(f.be||0),0,140);
   if(f.sell!==undefined) s.sell=f.sell;
   if(o.set) Object.assign(s.flags,o.set);
   s.log.push({st:SIM[s.si].id, stage:SIM[s.si].name, t:o.t, g:o.g, why:o.why});
   this.deltas={vig:f.vig||0,risk:f.risk||0,be:f.be||0}; this.dk++; this.resumed=false;
   this.focusNext();
  },
  lockEnv(){
   const s=this.sim, m=this.envM;
   s.envScore=m.score; s.risk=clamp(s.risk+m.extraRisk,2,95); s.envDone=true;
   const g=m.score>.85?'best':m.score>.6?'good':m.score>.35?'ok':'bad';
   const issues=[];
   if(m.tF<1) issues.push(s.env.temp<64?'too cold to pin (below ~64°F)':s.env.temp<70?'cool, so pinning is slow':'above 85°F, so the blocks are heat-stressed');
   if(m.cF<1) issues.push('CO₂ too high: leggy stems, small caps');
   if(m.hF<1) issues.push(m.rh<85?'humidity too low for the airflow: caps dry and crack':'humidity so high it invites bacteria');
   s.log.push({st:'fruit', stage:'Fruiting', t:`${s.env.temp}°F · ${s.env.fae} air exchanges/hr · ${m.rh}% RH`, g,

   this.deltas={risk:m.extraRisk}; this.dk++;
   this.focusNext();

   if(s.si<SIM.length-1){s.si++;s.qi=0;this.focusStage();return}

   if(fx&&fx.sell!==undefined&&fx.sell<1) out.push({t:'−'+Math.round((1-fx.sell)*100)+'% usable harvest',c:'dn'});
   return out;

 },

      <h1 style="margin-top:8px">Easy to colonize. <span>Hard to grow clean.</span></h1>
      <p class="lede">Pink oysters are aggressive and fast. You’re mostly fighting contamination on the rich substrates they love, a cold room, and a harvest that spoils in two days. Walk the six stages below, then run the simulator.</p>
      <div class="facts">
        <div class="fact"><b>70–85°F</b><span>fruiting range</span></div>
        <div class="fact"><b>&lt; 64°F</b><span>pins stall</span></div>
        <div class="fact"><b>1–2 days</b><span>fresh shelf life</span></div>
        <div class="fact"><b>1–2</b><span>strong flushes</span></div>
      </div>
      <div class="actions" style="margin-top:20px">
        <button class="btn" @click="go('sim')">Run the simulator</button>
        <button class="btn ghost" @click="go('cases')">Diagnose situations</button>
      </div>
    </div>
    <div class="art">
      <cluster-canvas :o="heroO" :w="480" :h="340" :label="cooked?'Cooked pink oysters, faded to tan':'Raw pink oyster cluster'"></cluster-canvas>
      <div class="toggle" role="group" aria-label="Raw or cooked">
        <button :aria-pressed="!cooked" @click="cooked=false">Raw</button>
        <button :aria-pressed="cooked" @click="cooked=true">Cooked</button>
      </div>
      <p class="muted" style="text-align:center;font-size:13px">{{ cooked ? 'Heat fades the pink to tan-brown. Sell the color raw.' : 'Tap Cooked to bust myth #1.' }}</p>
    </div>
  </div>

  <div class="stack">
    <span class="label">Your learning path · saved in this browser</span>
    <div class="path">
      <button v-for="(p,i) in pathSteps" :key="p.t" class="pstep" @click="p.go()">
        <span class="top"><span class="label">Step {{ i+1 }}</span><span class="tick" :class="{on:p.on}" aria-hidden="true">{{ p.on?'✓':'' }}</span></span>
        <b>{{ p.t }}</b>
        <span class="mini"><i :style="{width:Math.round(p.f*100)+'%'}"></i></span>
        <span class="mono">{{ p.d }}</span>
      </button>
    </div>
  </div>

  <div class="card stack">
    <span class="label">The one rule that runs the pipeline</span>
    <h2 style="font-size:clamp(22px,3vw,30px)">More nitrogen → more yield → more contamination risk → more sterility required</h2>
    <p class="muted">Every “best” choice is a point on this curve. The curve shape is illustrative, not measured data.</p>
    <tradeoff-chart></tradeoff-chart>
  </div>

  <div class="stack">
    <span class="label">The pipeline · tap a stage</span>
    <div class="pipeline">
      <button v-for="(g,i) in GUIDE" :key="g.id" class="pnode" :aria-pressed="gStage===g.id" @click="pickStage(g.id)">
        <stage-icon :id="g.icon"></stage-icon><b>{{g.name}}</b><span class="mono">{{g.mistakes.length}} mistakes</span>
      </button>
    </div>
  </div>

  <div id="stagepanel" class="stagepanel">
    <div class="card stack">
      <span class="label">Stage {{ GUIDE.indexOf(guide)+1 }} of 6</span>
      <h2>{{ guide.name }}</h2>
      <p>{{ guide.what }}</p>
      <div class="target"><span class="label">Optimizing for</span><p style="margin-top:2px"><b>{{ guide.target }}</b></p><p class="muted" style="font-size:14.5px;margin-top:2px">Success looks like: {{ guide.success }}</p></div>
      <span class="label">Best → acceptable</span>
      <ol class="picks"><li v-for="p in guide.picks" :key="p[0]"><div><b>{{p[0]}}</b> <span class="muted">{{p[1]}}</span></div></li></ol>
      <template v-if="guide.adds.length">
        <span class="label">Good additives</span>
        <div class="addrow"><span v-for="a in guide.adds" :key="a[0]" class="add"><b>{{a[0]}}</b> · {{a[1]}}</span></div>
      </template>
      <div class="stagenav">
        <button class="btn ghost sm" :disabled="gIdx===0" @click="pickStage(GUIDE[Math.max(0,gIdx-1)].id)">← {{ gIdx>0?GUIDE[gIdx-1].name:'Start' }}</button>
        <button v-if="gIdx<GUIDE.length-1" class="btn sm" @click="pickStage(GUIDE[gIdx+1].id)">Next: {{ GUIDE[gIdx+1].name }} →</button>
        <button v-else class="btn sm" @click="go('sim')">Run the simulator →</button>
      </div>
    </div>
    <div class="stack" style="align-content:start">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap">
        <span class="label">Common mistakes</span>
        <button class="btn ghost sm" @click="caseFilter=gStage;go('cases')">Practice {{ guide.name.toLowerCase() }} situations</button>
      </div>
      <div class="mist">
        <div v-for="m in guide.mistakes" :key="m[0]" class="mistake">
          <h4>{{ m[0] }}</h4>
          <p class="why">{{ m[1] }}</p>
          <p class="fix"><b>Fix:</b> {{ m[2] }}</p>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- ======================= SITUATIONS ======================= -->
<section v-else-if="tab==='cases'" class="tab">
  <div class="stack">
    <span class="label">Situations</span>
    <h1 style="font-size:clamp(30px,5vw,48px)">What’s going on with my grow?</h1>
    <p class="muted" style="max-width:62ch">These are the situations growers hit most. Read the symptom, make a call, then see the fix. Or switch to the myth sprint.</p>
    <div class="toggle" role="group" aria-label="Mode" style="justify-self:start">
      <button :aria-pressed="drill==='cases'" @click="drill='cases'">Diagnose ({{CASES.length}})</button>
      <button :aria-pressed="drill==='myths'" @click="drill='myths'">Myth sprint</button>
    </div>
  </div>

  <template v-if="drill==='cases'">
    <div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center">
      <div class="filters" role="group" aria-label="Filter by stage">
        <button :aria-pressed="caseFilter==='all'" @click="caseFilter='all'">All <span class="mono">{{answered}}/{{CASES.length}}</span></button>
        <button v-for="g in GUIDE" :key="g.id" :aria-pressed="caseFilter===g.id" @click="caseFilter=g.id">{{g.name}} <span class="mono">{{caseCount(g.id)[0]}}/{{caseCount(g.id)[1]}}</span></button>
      </div>
      <div class="actions" style="align-items:center">
        <label class="score" style="display:flex;gap:6px;align-items:center"><input id="hide-solved" type="checkbox" v-model="hideSolved" style="accent-color:var(--pink)"> Hide answered</label>
        <span class="score">{{caseScore[0]}}/{{caseScore[1]}} correct</span>
        <button class="btn ghost sm" @click="resetCases" :disabled="!caseScore[1]">Reset</button>
      </div>
    </div>
    <div class="mini" role="progressbar" :aria-valuenow="answered" aria-valuemin="0" :aria-valuemax="CASES.length" aria-label="Situations answered"><i :style="{width:answered/CASES.length*100+'%'}"></i></div>
    <div v-if="!casesShown.length" class="empty">{{ hideSolved?'You’ve answered every situation in this filter. Untick “Hide answered” to review them, or pick another stage.':'No situations here.' }}</div>
    <div class="cases">
      <article v-for="c in casesShown" :key="c.i" class="case">
        <div class="hd"><span class="chip plain">{{ guideFor(c.st).name }}</span><span class="label">Case {{ String(c.i+1).padStart(2,'0') }}</span></div>
        <p class="see">{{ c.see }}</p>
        <div class="copts">
          <button v-for="(o,j) in c.opts" :key="j" class="copt" :disabled="caseAns[c.i]!==undefined"
            :class="caseAns[c.i]===undefined?'':(j===c.a?'right':(caseAns[c.i]===j?'wrong':'fade'))"
            @click="pickCase(c.i,j)">{{ o }}</button>
        </div>
        <div v-if="caseAns[c.i]!==undefined" class="reveal" aria-live="polite">
          <span><span class="chip" :class="caseAns[c.i]===c.a?'good':'bad'">{{ caseAns[c.i]===c.a?'Correct':'Not quite' }}</span></span>
          <p><b>Fix:</b> {{ c.fix }}</p>
        </div>
      </article>
    </div>
    <div class="card" style="display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between">
      <p style="max-width:60ch"><b>Ready to run your own grow?</b> The simulator throws a random mix of these situations at you, so every run is a little different.</p>
      <button class="btn" @click="go('sim')">Open the simulator</button>
    </div>
  </template>

  <div v-else class="card stack" style="max-width:720px">
    <template v-if="!mDone">
      <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><span class="label">Myth or fact</span><span class="score">{{mi+1}} / {{myths.length}} · score {{mScore}}</span></div>
      <p class="myth">“{{ myths[mi].s }}”</p>
      <div class="tf">
        <button class="btn ghost" :disabled="mAns!==null" @click="mythAnswer(true)">Fact</button>
        <button class="btn ghost" :disabled="mAns!==null" @click="mythAnswer(false)">Myth</button>
      </div>
      <div v-if="mAns!==null" class="verdict" :class="mAns===myths[mi].a?'good':'bad'" aria-live="polite">
        <div><span class="chip" :class="mAns===myths[mi].a?'good':'bad'">{{ mAns===myths[mi].a?'Correct':'Wrong' }}</span> <b>{{ myths[mi].a?'Fact.':'Myth.' }}</b> {{ myths[mi].w }}</div>
      </div>
      <div class="actions" v-if="mAns!==null"><button class="btn" @click="mythNext">{{ mi<myths.length-1?'Next':'Finish' }}</button></div>
    </template>
    <template v-else>
      <span class="label">Myth sprint done</span>
      <p class="rank">{{ mScore }} / {{ myths.length }}</p>
      <p>{{ mScore>=7?'Sharp. You won’t fall for the usual forum advice.':mScore>=5?'Decent. Review the myths list on the cheat sheet.':'Worth a pass through the cheat sheet’s myth list.' }}</p>
      <div class="actions"><button class="btn" @click="startMyths">Another round</button><button class="btn ghost" @click="go('cheatsheet')">Cheat sheet</button></div>
    </template>
  </div>
</section>

<!-- ======================= SIMULATOR ======================= -->
<section v-else-if="tab==='sim'" class="tab">
  <div class="simbar">
    <span class="muted" style="font-size:14px">{{ resumed ? 'Resumed your saved run: '+curStage.days+', '+curStage.name+'.' : (sim.screen==='brief'?'A new run with fresh situations.':'Your run saves automatically in this browser.') }}</span>
    <template v-if="sim.screen!=='brief'">
      <div v-if="confirmRestart" class="confirm" role="alert">
        <span>Discard this run and start over?</span>
        <button class="btn sm" @click="restart">Discard</button>
        <button class="btn ghost sm" @click="confirmRestart=false">Keep playing</button>
      </div>
      <button v-else-if="sim.screen!=='report'" class="btn ghost sm" @click="confirmRestart=true">Restart run</button>
    </template>
  </div>
  <nav class="track" aria-label="Run progress">
    <div v-for="(s,i) in SIM" :key="s.id" class="node" :class="{now:sim.screen==='step'&&i===sim.si, done:sim.screen!=='brief'&&(sim.screen!=='step'||i<sim.si)}">
      {{ s.days }}<b>{{ s.name }}</b>
    </div>
  </nav>

  <div class="simgrid">
  <main>
    <!-- BRIEF -->
    <div v-if="sim.screen==='brief'" class="card stack">
      <span class="label">Run brief · seed {{ sim.seed % 10000 }}</span>
      <h2 style="font-size:clamp(26px,4vw,36px)">Your grow, from plate to plate</h2>
      <p>You’ll make about {{ totalSteps }} calls across six stages. Each stage also throws one random situation at you. In the fruiting room you set the conditions yourself. At the end, <b>six blocks</b> each roll against your contamination risk.</p>
      <div class="brief">
        <div><span class="label">Season</span><b>{{ sim.season.name }}</b><span class="muted" style="font-size:14px">{{ sim.season.note }}</span></div>
        <div><span class="label">Batch</span><b>6 blocks</b><span class="muted" style="font-size:14px">1 kg dry substrate each</span></div>
        <div><span class="label">Your best</span><b>{{ best ?? '—' }}</b><span class="muted" style="font-size:14px">score out of 100</span></div>
      </div>
      <p class="muted" style="font-size:14.5px">Scoring: decisions 55%, fruiting conditions 15%, harvest you actually keep 30%.</p>
      <div class="actions"><button class="btn" @click="simStart">Start the run</button><button class="btn ghost" @click="go('guide')">Review the guide first</button></div>
    </div>

    <!-- STEP -->
    <div v-else-if="sim.screen==='step'" class="card">
      <div class="stagehead">
        <span class="label">{{ curStage.days }} · step {{ sim.qi+1 }}/{{ sim.steps[sim.si].length }}</span>
        <h2 ref="stageH" tabindex="-1">{{ guideFor(curStage.id).name }}</h2>
        <p class="muted" style="font-size:14.5px"><b style="color:var(--ink)">Optimizing for:</b> {{ guideFor(curStage.id).target }}</p>
      </div>
      <details class="hintbox" :key="'h'+sim.si" @toggle="onHint">
        <summary>Field notes for {{ guideFor(curStage.id).name.toLowerCase() }}</summary>
        <p class="muted" style="margin-top:4px;font-size:13.5px">Free to open. Your report notes which stages you peeked at.</p>
        <ul><li v-for="m in guideFor(curStage.id).mistakes.slice(0,4)" :key="m[0]"><b>Avoid:</b> {{ m[0].toLowerCase() }}. {{ m[2] }}</li></ul>
      </details>

      <!-- fruiting room -->
      <div v-if="curStep.env" class="env">
        <div class="event"><span class="label">{{ sim.season.name }}</span><span>{{ sim.season.note }} The tote lid is sealed and the mister is on low. Set up the room, watch the preview, then lock it in.</span></div>
        <div class="slider">
          <div class="row"><label for="s-temp">Room temperature</label><span><b class="mono">{{ sim.env.temp }}°F</b> <span class="chip" :class="tStat(+sim.env.temp)[0]">{{ tStat(+sim.env.temp)[1] }}</span></span></div>
          <input id="s-temp" type="range" min="55" max="95" step="1" v-model.number="sim.env.temp" :disabled="sim.envDone">
          <span class="hint">Heater, heat mat or AC. Pinks are tropical.</span>
        </div>
        <div class="slider">
          <div class="row"><label for="s-fae">Fresh air exchange</label><span><b class="mono">{{ sim.env.fae }}/hr · ~{{ envM.co2 }} ppm CO₂</b> <span class="chip" :class="cStat(envM.co2)[0]">{{ cStat(envM.co2)[1] }}</span></span></div>
          <input id="s-fae" type="range" min="0" max="10" step="1" v-model.number="sim.env.fae" :disabled="sim.envDone">
          <span class="hint">Fan or vent the tote. More air lowers CO₂ but dries the air.</span>
        </div>
        <div class="slider">
          <div class="row"><label for="s-mist">Misting / humidifier</label><span><b class="mono">{{ envM.rh }}% RH</b> <span class="chip" :class="hStat(envM.rh)[0]">{{ hStat(envM.rh)[1] }}</span></span></div>
          <input id="s-mist" type="range" min="60" max="110" step="1" v-model.number="sim.env.mist" :disabled="sim.envDone">
          <span class="hint">Effective humidity drops as fresh air rises. The 85–95% target is common practice, not a figure from the guide.</span>
        </div>
        <div class="meter"><div class="row"><span>Room quality</span><b>{{ Math.round(envM.score*100) }}%</b></div><div class="bar"><i :style="{width:envM.score*100+'%',background:'var(--pink)'}"></i></div></div>
        <div class="actions" v-if="!sim.envDone"><button class="btn" @click="lockEnv">Lock in conditions</button></div>
        <div v-else class="verdict" :class="sim.log[sim.log.length-1].g">
          <div><span class="chip" :class="sim.log[sim.log.length-1].g">{{ GL[sim.log[sim.log.length-1].g] }}</span></div>
          <div>{{ sim.log[sim.log.length-1].why }}</div>
        </div>
      </div>

      <!-- choice step -->
      <template v-else>
        <div v-if="curStep.event" class="event"><span class="label">Situation</span><span>{{ curStep.event }}</span></div>
        <p class="q">{{ curStep.q }}</p>
        <div class="opts">
          <button v-for="(o,i) in curStep.opts" :key="sim.si+'-'+sim.qi+'-'+i" class="opt"
            :class="[sim.picked===i?'picked '+o.g:'', sim.picked!==null&&sim.picked!==i?'dim':'']"
            :disabled="sim.picked!==null" @click="choose(i)">
            <span class="key">{{ 'ABCDEFG'[i] }}</span><span class="txt">{{ o.t }}<small v-if="o.s">{{ o.s }}</small></span>
          </button>
        </div>
        <div v-if="sim.picked!==null" class="verdict" :class="curStep.opts[sim.picked].g" aria-live="polite">
          <div><span class="chip" :class="curStep.opts[sim.picked].g">{{ GL[curStep.opts[sim.picked].g] }}</span></div>
          <div>{{ curStep.opts[sim.picked].why }}</div>
          <div class="fx" v-if="fxList(curStep.opts[sim.picked].fx).length"><span v-for="f in fxList(curStep.opts[sim.picked].fx)" :class="f.c">{{ f.t }}</span></div>
        </div>
        <p class="kbd" v-if="sim.picked===null">Keys: <kbd>A</kbd>–<kbd>{{ 'ABCDEFG'[curStep.opts.length-1] }}</kbd> or <kbd>1</kbd>–<kbd>{{ curStep.opts.length }}</kbd> to choose · <kbd>Enter</kbd> to continue</p>
      </template>

      <div class="actions" style="margin-top:16px" v-if="sim.picked!==null">
        <button class="btn" ref="nextBtn" @click="next">{{ sim.qi<sim.steps[sim.si].length-1 ? 'Next decision' : (sim.si<SIM.length-1 ? 'On to '+guideFor(SIM[sim.si+1].id).name.toLowerCase() : 'Check the blocks') }}</button>
      </div>
    </div>

    <!-- BLOCKS -->
    <div v-else-if="sim.screen==='blocks'" class="card stack">
      <span class="label">Moment of truth</span>
      <h2 style="font-size:clamp(26px,4vw,34px)">Six blocks. Who stays clean?</h2>
      <p>Final contamination risk: <b class="mono">{{ riskFinal }}%</b> per block{{ sim.vig>50?', trimmed because vigorous mycelium outcompetes mold':'' }}. Each block rolls on its own.</p>
      <div class="blocks">
        <div v-for="(b,i) in sim.blocks" :key="i" class="blk" :class="b.state">
          <cluster-canvas v-if="b.state!=='pending'" :o="{...railCluster, contam:b.state==='contam', seed:i+3}" :w="200" :h="150" :label="'Block '+(i+1)+(b.state==='contam'?' contaminated':' fruiting')"></cluster-canvas>
          <div v-else style="aspect-ratio:4/3;display:grid;place-items:center" class="mono muted">?</div>
          <span class="mono">Block {{ i+1 }} · {{ b.state==='pending'?'colonizing':b.state==='clean'?'clean':'Trichoderma' }}</span>
        </div>
      </div>
      <div class="actions">
        <button class="btn" v-if="!sim.rolled" @click="rollBlocks">Roll all six</button>
        <button class="btn" v-else-if="sim.blocks.every(b=>b.state!=='pending')" @click="toReport">See the lab report</button>
      </div>
    </div>

    <!-- REPORT -->
    <div v-else class="stack">
      <div class="card stack">
        <span class="label">Lab report · score {{ total }}/100{{ best===total?' · new best':'' }}</span>
        <div class="rank">{{ rank[0] }}</div>
        <p>{{ rank[1] }}</p>
        <div class="stats">
          <div class="stat"><span class="label">Decisions</span><b>{{ decPts }}/{{ decMax }}</b></div>
          <div class="stat"><span class="label">Room quality</span><b>{{ Math.round(sim.envScore*100) }}%</b></div>
          <div class="stat"><span class="label">Clean blocks</span><b>{{ cleanBlocks }}/6</b></div>
          <div class="stat"><span class="label">Bio. efficiency</span><b>{{ beFinal }}%</b></div>
          <div class="stat"><span class="label">Fresh yield</span><b>{{ freshKg }} kg</b></div>
          <div class="stat"><span class="label">Kept / sold</span><b>{{ keptKg }} kg</b></div>
        </div>
        <p class="muted" style="font-size:13.5px">Yield = clean blocks × 1 kg dry substrate × BE. The numbers are game balance. The rankings follow the guide.</p>
        <p class="muted" style="font-size:13.5px">Field notes opened: {{ sim.hints.length ? sim.hints.map(h=>guideFor(h).name).join(', ') : 'none. Played from memory.' }}</p>
        <div class="actions"><button class="btn" @click="restart">New run (new situations)</button><button class="btn ghost" @click="copyResult">Copy result</button><button class="btn ghost" @click="go('cheatsheet')">Cheat sheet</button></div>
        <textarea v-if="copyFallback" id="copy-fallback" class="copy" readonly :value="copyFallback" @focus="$event.target.select()" aria-label="Result text to copy"></textarea>
      </div>
      <div class="card review" v-if="mistakes.length">
        <span class="label">What cost you · {{ mistakes.length }}</span>
        <div v-for="(m,i) in mistakes" :key="i" class="mistake" :style="m.g==='ok'?'border-left-color:var(--warn)':''">
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="chip" :class="m.g">{{ GL[m.g] }}</span><span class="label">{{ m.stage }}</span></div>
          <h4>{{ m.t }}</h4>
          <p class="why">{{ m.why }}</p>
          <div><button class="btn ghost sm" @click="study(m.st)">Study {{ guideFor(m.st).name.toLowerCase() }} mistakes</button></div>
        </div>
      </div>
      <div class="card review" v-else><span class="label">What cost you</span><p>Nothing. A clean sheet.</p></div>
      <div class="card">
        <span class="label">Full run log</span>
        <ul class="log" style="margin-top:10px"><li v-for="(l,i) in sim.log" :key="i"><span class="chip" :class="l.g">{{ GL[l.g] }}</span><span><b>{{ l.stage }}:</b> {{ l.t }}</span></li></ul>
      </div>
    </div>
  </main>

  <aside class="rail">
    <div class="vessel">
      <vessel-canvas v-if="railKind!=='cluster'" :kind="railKind" :cover="railCover" :contam="railContam" :flags="sim.flags" :seed="sim.seed%101"></vessel-canvas>
      <cluster-canvas v-else :o="railCluster" :label="railCap"></cluster-canvas>
      <div class="cap">{{ railCap }}</div>
    </div>
    <div class="card meters">
      <span class="label">Culture readout</span>
      <div class="meter"><div class="row"><span>Mycelial vigor</span><span><span v-if="deltas.vig" :key="'v'+dk" class="delta" :class="deltas.vig>0?'up':'dn'">{{ deltas.vig>0?'+':'' }}{{ deltas.vig }}</span><b>{{ sim.vig }}</b></span></div><div class="bar"><i :style="{width:sim.vig+'%',background:'var(--pink)'}"></i></div></div>
      <div class="meter"><div class="row"><span>Contamination risk</span><span><span v-if="deltas.risk" :key="'r'+dk" class="delta" :class="deltas.risk<0?'up':'dn'">{{ deltas.risk>0?'+':'' }}{{ deltas.risk }}</span><b>{{ sim.risk }}%</b></span></div><div class="bar"><i :style="{width:sim.risk+'%',background:riskColor}"></i></div></div>
      <div class="meter"><div class="row"><span>Yield potential (BE)</span><span><span v-if="deltas.be" :key="'b'+dk" class="delta" :class="deltas.be>0?'up':'dn'">{{ deltas.be>0?'+':'' }}{{ deltas.be }}</span><b>{{ sim.be }}%</b></span></div><div class="bar"><i :style="{width:Math.min(100,sim.be/1.4)+'%',background:'var(--ink)'}"></i></div></div>
      <div class="meter"><div class="row"><span>Run progress</span><b>{{ sim.screen==='brief'?0:sim.screen==='step'?Math.round(doneSteps/totalSteps*100):100 }}%</b></div><div class="bar"><i :style="{width:(sim.screen==='brief'?0:sim.screen==='step'?doneSteps/totalSteps*100:100)+'%',background:'var(--muted)'}"></i></div></div>
    </div>
  </aside>
  </div>
</section>

<!-- ======================= CHEAT SHEET ======================= -->
<section v-else class="tab">
  <div class="stack">
    <span class="label">Cheat sheet</span>
    <h1 style="font-size:clamp(30px,5vw,48px)">Pink oyster, on one page</h1>
    <p class="muted" style="max-width:64ch">Keep this open at the bench. Rankings are relative. Exact numbers vary by strain, environment and prep.</p>
    <div class="search">
      <input id="cs-q" type="search" v-model="csQ" placeholder="Search: gypsum, straw, 15 psi, humidity…" aria-label="Search the cheat sheet">
      <span class="score" v-if="csQ.trim()">{{ csTotal }} match{{ csTotal===1?'':'es' }}</span>
      <button v-if="csQ" class="btn ghost sm" @click="csQ=''">Clear</button>
    </div>
  </div>
  <div v-if="csQ.trim() && !csTotal" class="empty">Nothing matches “{{ csQ }}”. Try a material (straw, rye), a number (15 psi) or a stage name.</div>
  <div class="stack" v-if="csNums.length">
    <span class="label">Numbers to remember</span>
    <div class="nums"><div v-for="n in csNums" :key="n[0]+n[1]" class="num"><b>{{n[0]}}</b><span>{{n[1]}}</span></div></div>
  </div>
  <div class="stack" v-if="csGuide.length">
    <span class="label">Stage by stage</span>
    <div class="tblwrap"><table>
      <thead><tr><th>Stage</th><th>Optimize for</th><th>Use</th><th>Avoid</th><th>Add</th></tr></thead>
      <tbody>
        <tr v-for="g in csGuide" :key="g.id">
          <td><b>{{ g.name }}</b></td>
          <td>{{ g.target }}</td>
          <td><ul><li v-for="p in csItems(g.picks)" :key="p[0]">{{ p[0] }}</li></ul></td>
          <td><ul><li v-for="m in csItems(g.mistakes)" :key="m[0]">{{ m[0] }}</li></ul></td>
          <td><ul v-if="g.adds.length"><li v-for="a in csItems(g.adds)" :key="a[0]">{{ a[0] }}</li></ul><span v-else class="muted">—</span></td>
        </tr>
      </tbody>
    </table></div>
  </div>
  <div class="stack" v-if="csPrep.length">
    <span class="label">Pasteurize or sterilize?</span>
    <div class="tblwrap"><table>
      <thead><tr><th>Material</th><th>Nutrition</th><th>Do</th><th>Don’t</th></tr></thead>
      <tbody><tr v-for="p in csPrep" :key="p[0]"><td><b>{{p[0]}}</b></td><td>{{p[1]}}</td><td class="ok-t">{{p[2]}}</td><td class="no-t">{{p[3]}}</td></tr></tbody>
    </table></div>
    <p class="muted" style="font-size:14px">Rule of thumb: pasteurize lignin-rich, unsupplemented material. Sterilize anything with bran or soy.</p>
  </div>
  <div class="stack" v-if="csMyths.length">
    <span class="label">Myths, busted</span>
    <div class="myths2"><div v-for="m in csMyths" :key="m.s" class="m2"><span><span class="chip" :class="m.a?'good':'bad'">{{ m.a?'Fact':'Myth' }}</span></span><span v-if="m.a">{{ m.s }}</span><s v-else>{{ m.s }}</s><span class="muted">{{ m.w }}</span></div></div>
  </div>
</section>

<div v-if="toast" class="toast" role="status" aria-live="polite">{{ toast }}</div>
<footer>Built from the Pink Oyster (<i>Pleurotus djamor</i>) cultivation pipeline guide. Fruiting humidity targets, CO₂ estimates and all scores and yields in the simulator are illustrative additions, not figures from the guide.</footer>
`
};

Vue.createApp(App).mount('#app');
</script>

</body></html>
