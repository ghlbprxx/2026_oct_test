<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pink Oyster Run</title>
<meta name="description" content="Grow gourmet mushrooms at home: learn real cultivation by doing it, stage by stage.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="css/styles.css">
<script type="importmap">
{ "imports": {
  "vue": "https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.esm-browser.prod.js",
  "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.12.5/index.js"
} }
</script>
</head>
<body>
<div id="app"><div class="boot">Loading Pink Oyster Run…</div></div>

<!-- Classic script: explain a blank page instead of leaving one (file:// blocks ES modules; the CDN may be unreachable). -->
<script>
  (function () {
    var box = document.querySelector('#app .boot');
    function say(html) { box.innerHTML = html; box.className = 'boot error'; }
    if (location.protocol === 'file:') {
      say('<h2>Pink Oyster Run needs a local web server</h2><p>Browsers block ES modules on <code>file://</code>. In this folder run <code>npx serve .</code> or <code>python3 -m http.server 8000</code>, then open the http:// address it prints.</p>');
      return;
    }
    setTimeout(function () { if (!window.__porBooted) say('<h2>The game did not start</h2><p>Vue could not be loaded from the CDN (cdn.jsdelivr.net). Check your connection and reload. Details are in the browser console.</p>'); }, 8000);
  })();
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
