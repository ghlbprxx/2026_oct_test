<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pink Oyster Run</title>
<meta name="description" content="Run a tiny pink oyster mushroom farm for one season. Learn real cultivation by doing it: sterile technique, substrates, fruiting conditions and harvest timing.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a grow room on graph paper. Title -> play (shelf grid + side controls) -> season report. Overlays: action sheet, event modal, notebook. */
:root{
  --bg:#f2eef4; --grid:#e4dce8; --panel:#fcfbfd; --ink:#2a1b2e; --muted:#6c5c72; --line:#ddd2e2;
  --pink:#e2557a; --pink-deep:#b8325a; --pink-soft:#fbdde6;
  --good:#2b8a5d; --good-soft:#dcf0e5; --warn:#b07316; --warn-soft:#f8ecd2; --bad:#c0392b; --bad-soft:#f8dcd8;
  --shelf:#efe6ee; --scrim:rgba(30,16,34,.45);
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#18111a; --grid:#221a25; --panel:#221925; --ink:#f3eaf4; --muted:#b3a3b8; --line:#3a2d3f;
  --pink:#ff7a9c; --pink-deep:#e2557a; --pink-soft:#4a2132;
  --good:#5cc995; --good-soft:#173528; --warn:#e2ac52; --warn-soft:#3a2c14; --bad:#ff7a6b; --bad-soft:#3e1d1a;
  --shelf:#2b2030; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#18111a; --grid:#221a25; --panel:#221925; --ink:#f3eaf4; --muted:#b3a3b8; --line:#3a2d3f;
  --pink:#ff7a9c; --pink-deep:#e2557a; --pink-soft:#4a2132;
  --good:#5cc995; --good-soft:#173528; --warn:#e2ac52; --warn-soft:#3a2c14; --bad:#ff7a6b; --bad-soft:#3e1d1a;
  --shelf:#2b2030; --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;
  -webkit-tap-highlight-color:transparent;overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.game{max-width:1180px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) 90px max(16px,env(safe-area-inset-right))}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.btn{padding:10px 16px;border-radius:10px;border:none;background:var(--pink);color:#fff;font-weight:700;font-family:var(--display);font-size:16px;touch-action:manipulation}
.btn:hover{background:var(--pink-deep)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--pink)}
.btn.sm{padding:6px 11px;font-size:14px}
.btn.big{padding:14px 26px;font-size:19px}
.btn:disabled{opacity:.45;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:99px;font-weight:600;white-space:nowrap;background:var(--line);color:var(--ink)}
.chip.good{background:var(--good);color:var(--panel)} .chip.ok{background:var(--warn);color:var(--panel)} .chip.bad{background:var(--bad);color:var(--panel)}
.mini{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.mini i{display:block;height:100%;background:var(--pink);border-radius:99px}

/* title */
.title{display:grid;gap:18px;padding-top:24px}
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;align-items:center;padding:16px}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}}
.heroimg{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;display:block;background:var(--pink-soft)}
.hero h1{font-size:clamp(40px,7vw,72px);font-weight:800;letter-spacing:-.025em}
.hero h1 em{font-style:normal;color:var(--pink)}
.lede{font-size:18px;margin:10px 0 16px;max-width:48ch}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.howto div{border-left:3px solid var(--pink);padding:2px 0 2px 10px;font-size:14.5px}
.howto b{display:block;font-family:var(--display)}
.facts{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:14px}
.facts b{font-family:var(--mono);font-size:20px;display:block}

/* hud */
.hud{position:sticky;top:0;z-index:6;background:var(--bg);display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding:10px 0 8px;border-bottom:1px solid var(--line)}
.hud .logo{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.02em;margin-right:4px}
.hud .logo em{font-style:normal;color:var(--pink)}
.hs{display:grid;line-height:1.15}
.hs b{font-family:var(--mono);font-size:18px;font-variant-numeric:tabular-nums}
.hs.day{min-width:96px}
.hs.day .mini{margin-top:3px}
.hudbtns{margin-left:auto;display:flex;gap:6px}
.ib{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);font-size:18px;display:grid;place-items:center;touch-action:manipulation}
.ib:hover{border-color:var(--pink)}
.tip{display:block;width:100%;text-align:left;border:none;margin:10px 0;padding:9px 12px;border-radius:10px;background:var(--pink-soft);font-size:15px;min-height:42px;touch-action:manipulation}
.tip .go{font-weight:700;color:var(--pink-deep)}
.ib.heat{width:auto;padding:0 9px;grid-auto-flow:column;gap:4px;font-size:15px}
.ib.heat small{font-family:var(--mono);font-size:12px}
@media (max-width:560px){.hud .logo{display:none}.hud{gap:4px 14px}.hs b{font-size:16px}.ib{width:36px;height:36px}.slot .sstat{font-size:11px;left:6px;right:6px}.slot .slbl{font-size:9.5px;left:6px}.slot .sbadge{font-size:10px;padding:1px 5px}.bench{gap:7px}}
.tip b{font-family:var(--display)}

/* play grid */
.playgrid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
@media (max-width:880px){.playgrid{grid-template-columns:minmax(0,1fr)}}
.bench{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.slot{position:relative;aspect-ratio:1/1;border-radius:14px;border:1.5px solid var(--line);background:var(--panel);padding:0;overflow:hidden;text-align:left;touch-action:manipulation;transition:transform .12s,border-color .12s}
.slot:hover{border-color:var(--pink)}
.slot:active{transform:scale(.97)}
.slot::after{content:"";position:absolute;left:0;right:0;bottom:0;height:24%;background:var(--shelf);z-index:0}
.slot .art{position:absolute;inset:5% 7% 20% 7%;z-index:1}
.slot .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;transform-origin:50% 90%;transition:transform .4s}
.slot .slbl{position:absolute;left:8px;top:6px;z-index:2;font-family:var(--mono);font-size:11px;color:var(--muted);max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .sbadge{position:absolute;right:6px;top:6px;z-index:2;font-size:11px;font-family:var(--mono);font-weight:700;padding:2px 7px;border-radius:99px;background:var(--ink);color:var(--bg)}
.slot .sstat{position:absolute;left:8px;right:8px;bottom:13px;z-index:2;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .sbar{position:absolute;left:8px;right:8px;bottom:6px;height:4px;border-radius:9px;background:var(--line);z-index:2;overflow:hidden}
.slot .sbar i{display:block;height:100%;background:var(--pink)}
.slot .key{position:absolute;right:7px;bottom:13px;z-index:2;font-family:var(--mono);font-size:10px;color:var(--muted);opacity:.7}
@media (hover:none){.slot .key{display:none}}
.slot .empty{position:absolute;inset:0;display:grid;place-items:center;align-content:center;color:var(--muted);font-size:34px;z-index:2;line-height:1}
.slot .empty small{font-size:12px;font-family:var(--mono);margin-top:6px}
.slot.attn-harvest{border-color:var(--pink);box-shadow:0 0 0 3px var(--pink);animation:pulse 1.1s ease-in-out infinite}
.slot.attn-urgent{border-color:var(--warn);box-shadow:0 0 0 3px var(--warn);animation:pulse .6s ease-in-out infinite}
.slot.attn-mold{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad)}
.slot.attn-ready{border-color:var(--good);box-shadow:0 0 0 2px var(--good)}
.slot.attn-warn{border-color:var(--warn);box-shadow:0 0 0 2px var(--warn)}
.slot.lost .art{filter:saturate(.45) brightness(.9)}
.slot.wobble{animation:wobble .45s}
.slot .dbg{position:absolute;left:4px;top:22px;z-index:3;font:10px/1.2 var(--mono);background:#000b;color:#9f9;padding:2px 4px;border-radius:4px;white-space:pre}
@keyframes pulse{50%{box-shadow:0 0 0 6px transparent}}
@keyframes wobble{20%{transform:rotate(-2deg)}40%{transform:rotate(2deg)}60%{transform:rotate(-1.5deg)}80%{transform:rotate(1deg)}}

.side{display:grid;gap:12px}
.cardh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.ctl{display:grid;gap:4px;margin-top:10px}
.ctl .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ctl label{font-weight:700}
.ctl input[type=range]{width:100%;accent-color:var(--pink);height:28px}
.ctl .hint{font-size:12.5px;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{border:none;background:transparent;border-radius:8px;padding:7px 4px;font-family:var(--mono);font-size:13px;touch-action:manipulation}
.seg button[aria-pressed="true"]{background:var(--pink);color:#fff}
.readout{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:4px}
.readout div{background:var(--bg);border-radius:8px;padding:6px 8px;text-align:center}
.readout b{display:block;font-family:var(--mono);font-size:15px}
.readout span{font-size:11px;color:var(--muted)}
.gear{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;align-items:center}
.gear img{width:56px;height:56px;object-fit:contain}
.lots{display:grid;gap:4px;margin-top:6px}
.lot{display:grid;grid-template-columns:62px minmax(0,1fr) 48px;gap:8px;align-items:center;font-size:13px}
.lot .mini i{background:var(--good)}
.lot.old .mini i{background:var(--warn)}
.lot.dying .mini i{background:var(--bad)}
.log{list-style:none;margin:0;padding:0;display:grid;gap:5px;font-size:13.5px;max-height:190px;overflow:auto}
.log li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:6px}
.log li.bad{color:var(--bad)} .log li.good{color:var(--good)}

/* overlays */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);display:grid;align-items:end;justify-items:center}
@media (min-width:700px){.scrim{align-items:center}}
.sheet{width:min(560px,100%);max-height:88vh;overflow:auto;background:var(--panel);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.25)}
@media (min-width:700px){.sheet{border-radius:18px}}
.sheet.wide{width:min(860px,100%)}
.sheethead{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:12px;align-items:center;margin-bottom:12px}
.sheethead img{width:72px;height:72px;object-fit:contain;background:var(--bg);border-radius:10px}
.sheethead h3{font-size:22px}
.choice{display:grid;gap:8px;margin-top:8px}
.opt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);touch-action:manipulation}
.opt:hover:not(:disabled){border-color:var(--pink)}
.opt:disabled{opacity:.5;cursor:default}
.opt b{font-family:var(--display);font-size:16px}
.opt small{display:block;color:var(--muted);font-size:13px}
.opt .cost{font-family:var(--mono);font-size:13px;font-weight:600;white-space:nowrap}
.opt.warn{border-color:var(--bad)}
.subt{display:grid;gap:6px}
.subrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.subrow b{font-family:var(--display)}
.subrow small{display:block;color:var(--muted);font-size:12.5px}
.rich{letter-spacing:2px;color:var(--pink);font-size:12px}
.secth{margin:14px 0 4px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.note{border:1px dashed var(--line);border-radius:10px;padding:8px 12px;margin-top:12px;font-size:14px}
.note summary{cursor:pointer;font-weight:700;color:var(--pink-deep)}
.note ul{margin:6px 0 0;padding-left:18px}
.facts2{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px;margin:6px 0}
.facts2 div{background:var(--bg);border-radius:8px;padding:6px 9px}
.facts2 b{display:block;font-family:var(--mono);font-size:14px}
.facts2 span{font-size:11.5px;color:var(--muted)}
.verdict{margin-top:12px;padding:12px;border-radius:10px}
.verdict.good{background:var(--good-soft)} .verdict.bad{background:var(--bad-soft)}
.myth{font-family:var(--display);font-size:clamp(21px,3vw,26px);font-weight:600;margin:6px 0 12px}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pausebox{text-align:center;display:grid;gap:12px;justify-items:center}
.nbtabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:12px}
.nbtabs button{flex:0 0 auto;border:none;background:transparent;border-radius:99px;padding:6px 13px;font-family:var(--display);font-weight:600;color:var(--muted)}
.nbtabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.stages{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.stages button{border:1.5px solid var(--line);background:var(--bg);border-radius:99px;padding:4px 11px;font-size:14px}
.stages button[aria-pressed="true"]{border-color:var(--pink);background:var(--pink-soft)}
.mistake{border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:8px;padding:9px 12px;background:var(--bg);display:grid;gap:3px;font-size:14.5px}
.mistake.good{border-left-color:var(--good)}
.mistake.locked{border-left-color:var(--line);color:var(--muted)}
.mistake h4{font-size:16px}
.mistake .fix b{color:var(--good)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.num{background:var(--bg);border-radius:9px;padding:8px 10px}
.num b{display:block;font-family:var(--mono);font-size:18px;color:var(--pink-deep)}
.num span{font-size:12.5px;color:var(--muted)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
tr:last-child td{border-bottom:none}
.ok-t{color:var(--good);font-weight:700} .no-t{color:var(--bad);font-weight:700}
td code{font-family:var(--mono);font-size:12px}

/* report */
.report{display:grid;gap:14px;padding-top:24px}
.rank{font-family:var(--display);font-size:clamp(32px,5vw,48px);font-weight:800;color:var(--pink)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0}
.stat{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--bg)}
.stat b{display:block;font-family:var(--mono);font-size:20px}

/* feedback */
.toasts{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;display:grid;gap:6px;width:min(460px,calc(100% - 32px));pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:12px;font-size:14.5px;box-shadow:0 6px 24px rgba(0,0,0,.25);animation:tin .2s ease-out}
.toast.bad{background:var(--bad);color:#fff} .toast.good{background:var(--good);color:#fff}
.toast.lesson{background:var(--panel);color:var(--ink);border:2px solid var(--pink)}
.toast.lesson b{color:var(--pink-deep);font-family:var(--display)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.float{position:fixed;z-index:55;pointer-events:none;font-family:var(--display);font-weight:800;font-size:18px;color:var(--pink-deep);text-shadow:0 1px 0 var(--panel),0 0 6px var(--panel);transform:translate(-50%,-50%);animation:rise 1.1s ease-out forwards}
.float.good{color:var(--good)} .float.bad{color:var(--bad)}
.spore{position:fixed;z-index:54;width:8px;height:8px;border-radius:50%;background:var(--pink);pointer-events:none;animation:burst .7s ease-out forwards}
@keyframes rise{to{opacity:0;transform:translate(-50%,-160%)}}
@keyframes burst{to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.4)}}
.boot{padding:40px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.nojuice *{animation:none!important;transition:none!important}
.nojuice .float,.nojuice .spore{display:none}
</style>
</head>
<body>
<div id="app"><div class="boot">Loading Pink Oyster Run…</div></div>

<!-- Image manifest: copied from assets/images.json by tools/sync-manifest.mjs. When served over http the game fetches assets/images.json instead, so edits there win. -->
<script type="application/json" id="image-manifest">{"version":1,"game":"Pink Oyster Run","howToUse":["Each entry in 'images' is one picture the game shows. 'file' is where to save it, relative to pink-oyster-run/index.html.","Full prompt to send to the image model = stylePrompt + ' ' + prompt + ' ' + backgroundSuffix[background]. Use negativePrompt where the model supports it.","Generate at width x height (or any larger size with the same aspect ratio). PNG keeps transparency; WebP also works if you change the extension in 'file'.","Entries with 'alignWith' are revealed on top of that image with a growing mask, so the object must sit in the exact same place. Make them by editing the 'alignWith' image (img2img / inpaint / 'same image but...'), not from scratch.","'reveal' says which part of the canvas the growth mask sweeps over (fractions of width/height). If your art is framed differently, adjust these numbers instead of regenerating.","Missing files are fine: the game falls back to its built-in placeholder art for that id. Open the Notebook > Art tab in the game to see which files it found.","After editing this file, run: node pink-oyster-run/tools/sync-manifest.mjs  (copies it into index.html so the game also works when opened straight from disk)."],"stylePrompt":"Cozy storybook illustration for a casual mobile game. Clean vector-like shapes, soft cel shading and gentle gradients, confident dark plum outlines (#2a1b2e). Warm palette: flamingo pink (#e2557a), deep rose (#b8325a), cream-white mycelium (#fbf8f1), honey-amber agar (#ead7a8), wheat straw (#d9b65a), sawdust brown (#8a6040). One centered subject, front view tilted slightly from above, soft contact shadow directly underneath, even studio lighting, readable at small sizes.","backgroundSuffix":{"transparent":"Isolated subject on a fully transparent background (PNG alpha channel). Nothing else in frame.","opaque":"Full-bleed scene that fills the whole canvas. No transparency."},"negativePrompt":"text, letters, numbers, labels, watermark, logo, signature, hands, people, faces, photorealistic, grainy noise, busy background, cropped subject, multiple separate subjects, frame, border","images":[{"id":"plate_empty","file":"assets/img/plate_empty.png","width":512,"height":512,"background":"transparent","usedFor":"Agar plate on a shelf before mycelium grows. Bottom layer of every plate.","prompt":"A round glass petri dish seen from slightly above, filled with smooth, glossy honey-amber agar. Clean and empty: no growth, no spots. Small specular highlight on the upper-left rim.","framing":"Dish centered at 50% x, 49% y. Outer rim diameter about 86% of the canvas width. Agar surface radius about 40% of the width."},{"id":"plate_colonized","file":"assets/img/plate_colonized.png","width":512,"height":512,"background":"transparent","alignWith":"plate_empty","reveal":{"type":"radial","cx":0.5,"cy":0.49,"r":0.4},"usedFor":"Revealed over plate_empty as a growing circle while the plate colonizes.","prompt":"The exact same petri dish as the reference, now covered edge to edge in dense, fluffy cream-white mycelium, with fine ropey rhizomorphic strands radiating outward from a small square agar wedge in the center. Healthy and clean: no green, no other colors.","framing":"Identical framing to plate_empty."},{"id":"jar_empty","file":"assets/img/jar_empty.png","width":512,"height":512,"background":"transparent","usedFor":"Grain spawn jar before colonization (also while in the pressure cooker or waiting for spawn).","prompt":"A quart glass mason jar with a grey metal lid that has a small round white filter patch in its center, filled about 90% with plump, hydrated golden-brown rye berries. Clean glass, kernels loose, no water pooling at the bottom.","framing":"Jar centered. Lid top at about 8% of the height, jar bottom at about 94%. Grain fills from about 27% to 92% of the height."},{"id":"jar_colonized","file":"assets/img/jar_colonized.png","width":512,"height":512,"background":"transparent","alignWith":"jar_empty","reveal":{"type":"top-down","from":0.27,"to":0.92},"usedFor":"Revealed over jar_empty from the top down as the grain colonizes.","prompt":"The exact same mason jar as the reference, the grain now fully colonized: every rye kernel bound together by bright cream-white mycelium, a few kernels faintly visible through the white.","framing":"Identical framing to jar_empty."},{"id":"bag_straw","file":"assets/img/bag_straw.png","width":512,"height":512,"background":"transparent","usedFor":"Grow bag filled with chopped straw (pasteurized or sterilized), before colonization.","prompt":"A clear plastic mushroom grow bag standing upright, top folded flat, with a small white rectangular filter patch near the top. The bottom 60% is filled with chopped golden wheat straw pieces.","framing":"Bag centered. Bag top at about 5%, bottom at about 95% of the height. Substrate top edge at about 39% of the height."},{"id":"bag_sawdust","file":"assets/img/bag_sawdust.png","width":512,"height":512,"background":"transparent","alignWith":"bag_straw","usedFor":"Grow bag filled with supplemented hardwood (sawdust + bran, or Masters Mix), before colonization.","prompt":"The exact same grow bag as the reference, but the bottom 60% is filled with dense dark-brown hardwood sawdust and pellets with lighter tan flecks of soy hulls and bran.","framing":"Identical framing to bag_straw."},{"id":"bag_coir","file":"assets/img/bag_coir.png","width":512,"height":512,"background":"transparent","alignWith":"bag_straw","usedFor":"Grow bag filled with coir + vermiculite (also used for the coffee-grounds event bag).","prompt":"The exact same grow bag as the reference, but the bottom 60% is filled with dark-brown fluffy coco coir mixed with small sparkly white-grey vermiculite flecks.","framing":"Identical framing to bag_straw."},{"id":"bag_colonized","file":"assets/img/bag_colonized.png","width":512,"height":512,"background":"transparent","alignWith":"bag_sawdust","reveal":{"type":"top-down","from":0.39,"to":0.95},"usedFor":"Revealed over any of the three bag images from the top down while the bag colonizes.","prompt":"The exact same grow bag as the reference, the substrate now fully colonized into a solid cream-white block of mycelium, with faint texture of the substrate showing underneath.","framing":"Identical framing to bag_straw / bag_sawdust."},{"id":"block_ready","file":"assets/img/block_ready.png","width":512,"height":512,"background":"transparent","usedFor":"Colonized fruiting block before pins appear, and while resting between flushes.","prompt":"A fully colonized cream-white rectangular mushroom block with the plastic bag cut away, standing upright, with a small X-shaped cut on the front center. No mushrooms yet.","framing":"Block in the lower half: top edge at about 51%, bottom at about 95% of the height, about 42% of the width wide. X-cut centered at about 50% x, 65% y. Keep the upper half empty so clusters can grow into it."},{"id":"block_pins","file":"assets/img/block_pins.png","width":512,"height":512,"background":"transparent","alignWith":"block_ready","usedFor":"Block that is pinning (tiny primordia forming).","prompt":"The exact same block as the reference, with a tight cluster of tiny bright-pink mushroom pins (primordia) bursting from the X-cut.","framing":"Identical framing to block_ready."},{"id":"cluster_young","file":"assets/img/cluster_young.png","width":512,"height":512,"background":"transparent","alignWith":"block_ready","usedFor":"Cluster growing toward harvest.","prompt":"The exact same block as the reference, with a small young cluster of pink oyster mushrooms (Pleurotus djamor) growing from the X-cut: 5 to 6 small fan-shaped caps with edges curled under, rich flamingo pink.","framing":"Identical block framing to block_ready. The cluster may grow up into the empty upper half."},{"id":"cluster_peak","file":"assets/img/cluster_peak.png","width":512,"height":512,"background":"transparent","alignWith":"block_ready","usedFor":"Healthy cluster at peak: the harvest moment.","prompt":"The exact same block as the reference, with a large, perfect cluster of pink oyster mushrooms growing from the X-cut: 8 to 10 broad ruffled fan-shaped caps, edges still slightly curled down, vivid flamingo pink with deeper rose edges, short pale stems, pale-pink gills visible under the caps. Harvest-ready.","framing":"Identical block framing to block_ready. The cluster fills most of the upper half."},{"id":"cluster_leggy","file":"assets/img/cluster_leggy.png","width":512,"height":512,"background":"transparent","alignWith":"block_ready","usedFor":"Cluster grown in stale, high-CO2 air (too little fresh air exchange).","prompt":"The exact same block as the reference, with a stretched, leggy cluster of pink oyster mushrooms: long thin pale stems reaching upward and small, undersized pink caps, the look of too little fresh air.","framing":"Identical block framing to block_ready."},{"id":"cluster_dry","file":"assets/img/cluster_dry.png","width":512,"height":512,"background":"transparent","alignWith":"block_ready","usedFor":"Cluster grown in air that is too dry (low humidity).","prompt":"The exact same block as the reference, with a pink oyster cluster whose caps are dry and cracked: split edges curling upward, slightly faded pink, a few crispy brown edges, the look of low humidity.","framing":"Identical block framing to block_ready."},{"id":"cluster_overripe","file":"assets/img/cluster_overripe.png","width":512,"height":512,"background":"transparent","alignWith":"block_ready","usedFor":"Cluster left past its peak; will drop if not picked.","prompt":"The exact same block as the reference, with an overripe pink oyster cluster: caps flattened and turned up at the edges, color faded to washed-out pale pink, wavy edges, and a fine dusting of pale spores on the block below.","framing":"Identical block framing to block_ready."},{"id":"block_spent","file":"assets/img/block_spent.png","width":512,"height":512,"background":"transparent","alignWith":"block_ready","usedFor":"Block after its flushes are used up, waiting to be retired.","prompt":"The exact same block as the reference, now tired and spent: shrunken, dented, slightly yellowed tan-cream, with a couple of small dried brown mushroom stubs at the X-cut.","framing":"Identical framing to block_ready."},{"id":"mold_overlay","file":"assets/img/mold_overlay.png","width":512,"height":512,"background":"transparent","usedFor":"Drawn on top of any plate, jar or bag when contamination becomes visible. Opacity and size grow with the infection.","prompt":"Only patches of green Trichoderma mold and nothing else: 5 to 7 fuzzy round colonies, dark emerald-green centers fading to a soft white fuzzy ring at the edges, scattered across the middle of the frame.","framing":"Patches stay inside the central 60% of the canvas. Transparency everywhere else is essential: this layer sits on top of other images."},{"id":"crate_fresh","file":"assets/img/crate_fresh.png","width":256,"height":256,"background":"transparent","usedFor":"Icon for the fresh-harvest crate.","prompt":"A small woven wicker basket heaped with fresh, bright pink oyster mushroom clusters.","framing":"Basket centered, filling about 85% of the canvas."},{"id":"crate_dried","file":"assets/img/crate_dried.png","width":256,"height":256,"background":"transparent","usedFor":"Icon for dehydrated mushrooms.","prompt":"A small glass jar with a cork lid filled with dried, shriveled tan and faded-pink oyster mushroom pieces.","framing":"Jar centered, filling about 85% of the canvas."},{"id":"cooker","file":"assets/img/cooker.png","width":256,"height":256,"background":"transparent","usedFor":"Icon for the pressure cooker (sterilizer) widget.","prompt":"A stovetop aluminum pressure cooker with a round pressure gauge on the lid and two black handles, a small puff of steam rising from the valve.","framing":"Pot centered, filling about 85% of the canvas."},{"id":"title_hero","file":"assets/img/title_hero.png","width":1280,"height":720,"background":"opaque","usedFor":"Title screen illustration.","prompt":"A cozy small home mushroom grow room in the evening: wooden shelves holding petri dishes, mason jars of white grain spawn and grow bags; in the foreground right, a large vivid pink oyster mushroom cluster fruiting from a cream block; soft warm lamp light and a little humidifier mist; pastel pink and cream palette.","framing":"Wide 16:9 scene. Main cluster in the right half."}]}</script>

<script type="text/x-template" id="tpl">
<div class="game" :class="{nojuice:!CONFIG.dev.juice}">

  <!-- ============ TITLE ============ -->
  <section v-if="ui.screen==='title'" class="title">
    <div class="hero card">
      <img class="heroimg" :src="src('title_hero')" alt="Pink oyster mushrooms fruiting in a small home grow room">
      <div>
        <span class="label">A tiny mushroom farm · one season</span>
        <h1 style="margin-top:6px">Pink Oyster <em>Run</em></h1>
        <p class="lede">Grow <i>Pleurotus djamor</i> from a petri dish to a market table before winter sets in. Rich recipes grow huge clusters, and they grow mold just as fast.</p>
        <div class="actions">
          <button class="btn big" @click="start()">Start the season</button>
          <button class="btn ghost" @click="openNb('guide')">Grower's notebook</button>
        </div>
        <div class="facts">
          <div><span class="label">Best profit</span><b>{{ ui.best==null ? '—' : money(ui.best) }}</b></div>
          <div><span class="label">Lessons found</span><b>{{ lessonCount }}/{{ LESSON_IDS.length }}</b></div>
          <div><span class="label">Season</span><b>{{ CONFIG.time.seasonDays }} days</b></div>
        </div>
      </div>
    </div>
    <div class="howto">
      <div><b>1 · Plate → jar → bag</b>Pour agar, spawn sterile grain, then mix grain into bulk substrate. One plate feeds 3 jars; one jar feeds 2 bags.</div>
      <div><b>2 · Gamble on richness</b>Richer substrate means bigger flushes and more mold. The pressure cooker is your bottleneck.</div>
      <div><b>3 · Run the fruiting room</b>Heat, fresh air and mist decide whether blocks pin, and how good the clusters look.</div>
      <div><b>4 · Pick at peak, sell fast</b>Market every {{ CONFIG.economy.marketEvery }} days. Fresh pinks last about {{ CONFIG.economy.shelfLife }} days. Dry the rest.</div>
    </div>
  </section>

  <!-- ============ PLAY ============ -->
  <section v-else-if="ui.screen==='play' && g">
    <header class="hud">
      <span class="logo">Pink Oyster <em>Run</em></span>
      <div class="hs day"><span class="label">Day</span><b>{{ Math.floor(g.day)+1 }}<span class="muted" style="font-size:13px"> / {{ CONFIG.time.seasonDays }}</span></b><div class="mini"><i :style="{width:Math.min(100,g.day/CONFIG.time.seasonDays*100)+'%'}"></i></div></div>
      <div class="hs"><span class="label">Cash</span><b>{{ money(g.cash) }}</b></div>
      <div class="hs"><span class="label">Room</span><b>{{ env.temp }}°F <span class="chip" :class="tS[0]">{{ tS[1] }}</span></b></div>
      <div class="hs"><span class="label">Market</span><b>{{ marketIn<=0.05 ? 'today' : 'in '+marketIn.toFixed(1)+'d' }}</b></div>
      <div class="hudbtns">
        <button class="ib heat" @click="setHeater((g.heater+1)%3)" :aria-label="'Heater: '+['off','low','high'][g.heater]+'. Tap to change.'" title="Heater (H)">🔥<small>{{ ['Off','Low','High'][g.heater] }}</small></button>
        <button class="ib" @click="togglePause" :aria-label="ui.paused?'Resume':'Pause'" title="Pause (Space)">{{ ui.paused ? '▶' : '⏸' }}</button>
        <button class="ib" @click="openNb()" aria-label="Grower's notebook" title="Notebook (N)">📓</button>
        <button class="ib" @click="toggleMute" :aria-label="ui.muted?'Unmute':'Mute'" title="Mute (M)">{{ ui.muted ? '🔇' : '🔊' }}</button>
      </div>
    </header>
    <button class="tip" v-if="CONFIG.look.tips" aria-live="polite" @click="doTip"><b>Next:</b> {{ tip.t }}<span v-if="tip.slot!=null || tip.room || tip.dry || tip.heat" class="go"> →</span></button>
    <div v-else style="height:10px"></div>

    <div class="playgrid">
      <main class="bench" aria-label="Shelves">
        <button v-for="(v,i) in g.slots" :key="i+'-'+(v?v.id:0)" class="slot" :class="slotCls(v,i)" :data-slot="i" @click="tapSlot(i)" :aria-label="slotAria(v,i)">
          <template v-if="v">
            <span class="art"><img v-for="(l,k) in layers(v)" :key="k" :src="src(l.id)" :style="l.style" alt=""></span>
            <span class="slbl">#{{ v.id }} {{ vName(v) }}</span>
            <span class="sbadge" v-if="badge(v)">{{ badge(v) }}</span>
            <span class="sstat">{{ status(v) }}</span>
            <span class="sbar"><i :style="{width:barPct(v)+'%',background:barColor(v)}"></i></span>
            <span v-if="CONFIG.dev.debug" class="dbg">{{ dbg(v) }}</span>
          </template>
          <span v-else class="empty">+<small>Empty shelf</small></span>
          <span class="key" v-if="i<9">{{ i+1 }}</span>
        </button>
      </main>

      <aside class="side">
        <div class="card" id="room">
          <div class="cardh"><span class="label">Grow room</span><span class="mono" style="font-size:12px">Room quality {{ Math.round(env.score*100) }}%</span></div>
          <div class="readout">
            <div><b>{{ env.temp }}°F</b><span>{{ tS[1] }}</span></div>
            <div><b>{{ env.co2 }}</b><span>ppm CO₂ · {{ cS[1] }}</span></div>
            <div><b>{{ env.rh }}%</b><span>RH · {{ hS[1] }}</span></div>
          </div>
          <div class="ctl">
            <div class="row"><label>Heater</label><span class="mono" style="font-size:12px">{{ money(g.heater*CONFIG.economy.heaterCost,2) }}/day</span></div>
            <div class="seg" role="group" aria-label="Heater">
              <button v-for="h in [0,1,2]" :key="h" :aria-pressed="g.heater===h" @click="setHeater(h)">{{ ['Off','Low','High'][h] }}</button>
            </div>
            <span class="hint">Season {{ baseTemp }}°F{{ g.snap ? ' (cold snap!)' : '' }}{{ g.forecast ? ' · cold snap tomorrow' : '' }}. Heater adds {{ CONFIG.room.heaterStep }}°F per step.</span>
          </div>
          <div class="ctl">
            <div class="row"><label for="fae">Fresh air</label><span class="chip" :class="cS[0]">{{ cS[1] }}</span></div>
            <input id="fae" type="range" min="0" max="10" step="1" v-model.number="g.fae">
            <span class="hint">More air lowers CO₂ but dries the room.</span>
          </div>
          <div class="ctl">
            <div class="row"><label for="mist">Mist</label><span class="chip" :class="hS[0]">{{ hS[1] }}</span></div>
            <input id="mist" type="range" min="60" max="110" step="1" v-model.number="g.mist">
            <span class="hint">Aim for 85–95% RH. Above ~96% invites bacteria.</span>
          </div>
        </div>

        <div class="card gear">
          <img :src="src('cooker')" alt="">
          <div>
            <div class="cardh" style="margin:0"><b>Pressure cooker</b><span class="mono" style="font-size:12px">{{ g.cooker.batch.length }}/{{ CONFIG.equipment.cookerCapacity }}</span></div>
            <div class="mini" style="margin:5px 0"><i :style="{width:(g.cooker.batch.length?g.cooker.t/CONFIG.equipment.cookerDays*100:0)+'%'}"></i></div>
            <span class="muted" style="font-size:13px">{{ g.cooker.batch.length ? 'Sterilizing · '+Math.max(0,CONFIG.equipment.cookerDays-g.cooker.t).toFixed(1)+' days left' : 'Idle' }}{{ g.queue.length ? ' · '+g.queue.length+' waiting' : '' }}</span>
          </div>
        </div>

        <div class="card">
          <div class="gear">
            <img :src="src('crate_fresh')" alt="">
            <div>
              <div class="cardh" style="margin:0"><b>Fresh crate</b><span class="mono">{{ freshKg.toFixed(2) }} kg</span></div>
              <span class="muted" style="font-size:13px">{{ money(CONFIG.economy.priceFresh) }}/kg at market · lasts ~{{ CONFIG.economy.shelfLife }} days</span>
            </div>
          </div>
          <div class="lots" v-if="g.lots.length">
            <div v-for="l in g.lots" :key="l.id" class="lot" :class="lotCls(l)">
              <span class="mono">{{ l.kg.toFixed(2) }} kg</span>
              <span class="mini"><i :style="{width:Math.max(0,100-l.age/CONFIG.economy.shelfLife*100)+'%'}"></i></span>
              <span class="mono muted">{{ Math.max(0,CONFIG.economy.shelfLife-l.age).toFixed(1) }}d</span>
            </div>
          </div>
          <div class="gear" style="margin-top:10px">
            <img :src="src('crate_dried')" alt="">
            <div>
              <div class="cardh" style="margin:0"><b>Dried</b><span class="mono">{{ g.dried.toFixed(2) }} kg</span></div>
              <span class="muted" style="font-size:13px">{{ money(CONFIG.economy.priceDried) }}/kg · keeps all season</span>
            </div>
          </div>
          <div class="actions" style="margin-top:10px"><button class="btn sm" :disabled="!g.lots.length" @click="dryAll">Dehydrate all fresh (D)</button></div>
        </div>

        <div class="card">
          <div class="cardh"><span class="label">Grow log</span></div>
          <ul class="log"><li v-for="(l,i) in g.log.slice(0,14)" :key="i" :class="l.c"><span class="mono muted">d{{ l.d }}</span><span>{{ l.t }}</span></li></ul>
        </div>
      </aside>
    </div>
  </section>

  <!-- ============ REPORT ============ -->
  <section v-else-if="ui.screen==='report' && g" class="report">
    <div class="card">
      <span class="label">Season report · {{ g.endReason==='broke' ? 'ran out of money on day '+(Math.floor(g.day)+1) : CONFIG.time.seasonDays+' days' }}{{ ui.newBest ? ' · new best' : '' }}</span>
      <div class="rank">{{ rank[0] }}</div>
      <p>{{ rank[1] }}</p>
      <div class="stats">
        <div class="stat"><span class="label">Profit</span><b>{{ money(profit) }}</b></div>
        <div class="stat"><span class="label">Harvested</span><b>{{ g.stats.harvestKg.toFixed(2) }} kg</b></div>
        <div class="stat"><span class="label">Sold fresh</span><b>{{ g.stats.freshKg.toFixed(2) }} kg</b></div>
        <div class="stat"><span class="label">Sold dried</span><b>{{ g.stats.driedKg.toFixed(2) }} kg</b></div>
        <div class="stat"><span class="label">Rotted</span><b>{{ g.stats.rotKg.toFixed(2) }} kg</b></div>
        <div class="stat"><span class="label">Lost to mold</span><b>{{ lostTotal }}</b></div>
        <div class="stat"><span class="label">Clusters dropped</span><b>{{ g.stats.dropped }}</b></div>
        <div class="stat"><span class="label">Heating bill</span><b>{{ money(g.stats.energy) }}</b></div>
      </div>
      <div class="actions"><button class="btn" @click="start()">Play another season</button><button class="btn ghost" @click="openNb('lessons')">Notebook</button><button class="btn ghost" @click="ui.screen='title'">Title</button></div>
    </div>
    <div class="card" v-if="lostTotal">
      <span class="label">What the mold cost you</span>
      <div class="grid2" style="margin-top:8px">
        <div v-for="(n,why) in g.stats.lost" :key="why" class="mistake">
          <h4>{{ n }} × {{ LESSONS[why].title }}</h4>
          <p class="muted">{{ LESSONS[why].why }}</p>
          <p class="fix"><b>Fix:</b> {{ LESSONS[why].fix }}</p>
        </div>
      </div>
    </div>
    <div class="card">
      <span class="label">Lessons from this season · {{ g.learned.length }}</span>
      <div class="grid2" style="margin-top:8px" v-if="g.learned.length">
        <div v-for="id in g.learned" :key="id" class="mistake" :class="{good:LESSONS[id].good}">
          <h4>{{ LESSONS[id].title }}</h4><p class="muted">{{ LESSONS[id].why }}</p><p class="fix"><b>{{ LESSONS[id].good ? 'Keep doing it:' : 'Fix:' }}</b> {{ LESSONS[id].fix }}</p>
        </div>
      </div>
      <p v-else class="muted" style="margin-top:6px">None this time.</p>
    </div>
  </section>

  <!-- ============ ACTION SHEET ============ -->
  <div v-if="ui.sheet && g" class="scrim" @click.self="closeSheet">
    <div class="sheet" role="dialog" aria-modal="true" :aria-label="sheetTitle">
      <div class="sheethead">
        <img :src="src(sheetImg)" alt="">
        <div><span class="label">Shelf {{ ui.sheet.slot+1 }}{{ sv ? ' · #'+sv.id : '' }}</span><h3>{{ sheetTitle }}</h3></div>
        <button class="ib" @click="closeSheet" aria-label="Close">✕</button>
      </div>

      <!-- empty shelf: build menu -->
      <template v-if="!sv">
        <div class="secth"><b>Pour an agar plate</b><span class="mono muted">{{ money(CONFIG.economy.plateCost) }} · from your clean fridge slant</span></div>
        <div class="choice">
          <button v-for="(m,k) in MEDIA" :key="k" class="opt" @click="pourPlate(ui.sheet.slot,k)"><span><b>{{ m.full }}</b><small>{{ m.blurb }}</small></span><span class="cost">~{{ plateDaysFor(k) }}d</span></button>
        </div>
        <div class="secth"><b>Prep a grain jar</b><span class="mono muted">{{ money(CONFIG.economy.jarCost) }} · rye, field capacity, 1% gypsum</span></div>
        <div class="choice">
          <button class="opt" @click="prepJar(ui.sheet.slot,'ster')"><span><b>Pressure-cook (sterilize)</b><small>90–120 min at 15 psi. Waits for a cooker slot ({{ cookerLine }}).</small></span><span class="cost">cooker</span></button>
          <button class="opt" @click="prepJar(ui.sheet.slot,'past')"><span><b>Hot-water bath (pasteurize)</b><small>Quick: ready in half a day, no cooker needed.</small></span><span class="cost">½d</span></button>
        </div>
        <div class="secth"><b>Prep a substrate bag</b><span class="mono muted">1 kg dry substrate</span></div>
        <div class="subt">
          <div v-for="(r,k) in BUYABLE" :key="k" class="subrow">

<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
<script>
/* ============================== TUNING (admin panel) ============================== */
const CONFIG_SCHEMA = {

    jarPasteurized: { value: 0.2, min: 0, max: 0.6, step: 0.01, note: 'Daily mold chance, pasteurized grain (should feel near-certain)' },

  },
  economy: {

    priceFresh: { value: 12, min: 1, max: 40, step: 0.5, note: 'Market price per kg fresh' },
    priceDried: { value: 7, min: 1, max: 40, step: 0.5, note: 'Price per fresh-kg once dried. Keep below fresh.' },
    plateCost: { value: 1, min: 0, max: 10, step: 0.5, note: 'Cost to pour a plate' },
    jarCost: { value: 2, min: 0, max: 10, step: 0.5, note: 'Cost of a grain jar' },
    heaterCost: { value: 0.25, min: 0, max: 2, step: 0.05, note: 'Cost per day per heater step' },
    marketEvery: { value: 3, min: 1, max: 7, step: 1, note: 'Days between market days' },

    quizChance: { value: 0.5, min: 0, max: 1, step: 0.05, note: 'Chance a customer asks a myth-or-fact on market day' },
    targetProfit: { value: 120, min: 20, max: 500, step: 5, note: 'Profit that earns the top rank' },
  },
  equipment: {
    slots: { value: 9, min: 4, max: 15, step: 1, restart: true, note: 'Shelves in the grow room' },
    cookerCapacity: { value: 3, min: 1, max: 9, step: 1, note: 'Vessels per pressure-cooker batch: the sterility bottleneck' },

  },

  look: {

  },

    timeScale: { value: 1, min: 0.1, max: 3, step: 0.1, note: 'Slow-mo to inspect feel' },
    paused: { value: false },
    god: { value: false, note: 'No damage: no mold, no rot' },
    debug: { value: false, note: 'Shows hidden mold, hazards and timers on each shelf' },
    juice: { value: true, note: 'Off = grey-box test (no sounds, floaters, pulses)' },
    startLevel: { value: 1, min: 1, max: 2, step: 1, restart: true, note: '1 = tutorial bench (stocked), 2 = one plate, empty shelves' },
  },

// ===== ISF Admin Panel (drop-in, no dependencies) =====
const ADMIN_ENABLED = true; // false hides the panel in a release build; CONFIG still works
const ISF = (() => {
  const S = CONFIG_SCHEMA, KEY = 'isf:' + location.pathname;
  const build = () => Object.fromEntries(Object.entries(S).map(([g, f]) =>
    [g, Object.fromEntries(Object.entries(f).map(([k, d]) => [k, d.value]))]));
  const defaults = build(), actions = [], rows = [];
  let C = build(), restart = null, bar = null, out = null;
  const m = { events: {}, deaths: {}, runs: [], runStart: performance.now() };

  function diff() {
    const d = {};
    for (const g in C) for (const k in C[g]) if (C[g][k] !== defaults[g][k]) (d[g] ??= {})[k] = C[g][k];
    return d;
  }
  function load(d) {
    for (const g in d || {}) for (const k in d[g]) if (g in C && k in C[g]) C[g][k] = d[g][k];
  }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(diff())); } catch (e) {} };
  const refresh = () => rows.forEach(sync => sync());
  try { load(JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}

  function track(type, data = {}) {
    m.events[type] = (m.events[type] || 0) + 1;
    if (type === 'runStart') m.runStart = performance.now();
    if (type === 'death') { const c = data.cause || 'unknown'; m.deaths[c] = (m.deaths[c] || 0) + 1; }
    if (type === 'runEnd') m.runs.push({ ...data, seconds: Math.round((performance.now() - m.runStart) / 1000) });
  }
  const report = () => JSON.stringify({ configDiff: diff(), metrics: m }, null, 2);

  const kind = d => d.options ? 'enum' : typeof d.value === 'boolean' ? 'bool'
    : typeof d.value === 'number' ? 'num' : /^#[0-9a-f]{6}$/i.test(d.value) ? 'color' : 'text';

  function row(g, k) {
    const d = S[g][k], t = kind(d), r = document.createElement('div'), name = document.createElement('span');
    r.className = 'r'; r.title = d.note || '';
    name.textContent = k + (d.restart ? ' ↻' : '');
    let inp, num;
    if (t === 'enum') { inp = document.createElement('select'); d.options.forEach(o => inp.add(new Option(o, o))); }
    else { inp = document.createElement('input'); inp.type = { bool: 'checkbox', num: 'range', color: 'color', text: 'text' }[t]; }
    if (t === 'num') {
      Object.assign(inp, { min: d.min ?? 0, max: d.max ?? (Math.abs(d.value) * 4 || 1), step: d.step ?? 'any' });
      num = document.createElement('input'); num.type = 'number'; num.step = inp.step;
    }
    const sync = () => {
      const v = C[g][k];
      if (t === 'bool') inp.checked = v; else inp.value = v;
      if (num) num.value = v;
      r.classList.toggle('ch', v !== defaults[g][k]);
    };
    const onInput = el => {
      const v = t === 'bool' ? el.checked : t === 'num' ? +el.value : el.value;
      if (t === 'num' && (el.value === '' || !Number.isFinite(v))) return;
      C[g][k] = v; save();
      if (num) (el === num ? inp : num).value = v;
      r.classList.toggle('ch', v !== defaults[g][k]);
    };
    for (const el of [inp, num]) if (el) {
      el.addEventListener('input', () => onInput(el));
      el.addEventListener('change', () => { onInput(el); if (d.restart) restart?.(); });
    }
    name.ondblclick = () => { C[g][k] = defaults[g][k]; save(); sync(); if (d.restart) restart?.(); };
    r.append(name, inp); if (num) r.append(num);
    sync(); rows.push(sync); return r;
  }

  function addButton(label, fn) {
    const b = document.createElement('button'); b.textContent = label; b.onclick = fn; bar.append(b);
  }
  function emit(text) {
    out.value = text; out.focus(); out.select();
    try { navigator.clipboard?.writeText(text).catch(() => {}); } catch (e) {}
  }

  function mount() {
    const host = document.createElement('div'), root = host.attachShadow({ mode: 'open' });
    document.body.appendChild(host);
    for (const ev of ['keydown', 'keyup', 'pointerdown', 'pointerup', 'mousedown', 'touchstart', 'wheel', 'click'])
      host.addEventListener(ev, e => e.stopPropagation()); // keep panel input away from the game
    root.innerHTML = `<style>
      *{box-sizing:border-box;font:12px/1.4 system-ui,sans-serif}
      .fab{position:fixed;right:10px;bottom:10px;z-index:2147483647;width:40px;height:40px;border-radius:50%;border:0;background:#000a;color:#fff;font-size:20px;cursor:pointer}
      .p{position:fixed;top:0;right:0;bottom:0;z-index:2147483646;width:min(360px,100vw);overflow:auto;background:#111e;color:#eee;padding:10px 10px 60px;transform:translateX(105%);transition:transform .15s}
      .p.o{transform:none}
      .bar{display:flex;flex-wrap:wrap;gap:4px}
      .h{color:#999;margin:6px 0}
      details{border-top:1px solid #333;padding:4px 0}
      summary{cursor:pointer;font-weight:600;color:#bbb;text-transform:uppercase}

    get CONFIG() { return C; }, defaults, diff, report, track,
    bind: proxy => { C = proxy; },
    load: d => { load(d); save(); refresh(); },
    onRestart: fn => { restart = fn; },
    action: (label, fn) => { actions.push([label, fn]); if (bar) addButton(label, fn); },

function envModel(temp, fae, mist) {

  const cF = co2 <= 1000 ? 1 : Math.max(0.3, 1 - (co2 - 1000) / 4200);
  const hF = rh >= 85 && rh <= 95 ? 1 : rh < 85 ? Math.max(0.3, 1 - (85 - rh) * 0.035) : 0.9;
  return { temp, co2, rh, tF, cF, hF, score: tF * cF * hF };

/* ---------- contamination ---------- */
const isBlock = v => v && v.kind === 'bag' && FRUIT.includes(v.state === 'lost' ? v.lostFrom : v.state);

  h *= C.fruitingMult;
  if (env.rh > 96) h += RULES.soggyHazard;

}

    if (v.prep === 'ster' && v.recipe === 'straw') return 'steril_straw';

const mediumSpeed = m => m === 'super' ? RULES.superSpeed : m === 'cma' ? RULES.cmaSpeed : 1;

/* ---------- feedback ---------- */
function toast(text, c = '', title = '') {
  const id = ++fxSeq; ui.toasts.push({ id, text, c, title }); if (ui.toasts.length > 3) ui.toasts.shift();
  setTimeout(() => { const i = ui.toasts.findIndex(t => t.id === id); if (i >= 0) ui.toasts.splice(i, 1); }, title ? 5200 : 3400);
}
function log(t, c = '') { const g = S.g; g.log.unshift({ d: Math.floor(g.day) + 1, t, c }); if (g.log.length > 40) g.log.pop(); }
function slotRect(i) { const el = document.querySelector(`[data-slot="${i}"]`); return el ? el.getBoundingClientRect() : null; }
function float(i, text, c = '') {
  if (!CONFIG.dev.juice) return;
  const r = slotRect(i); if (!r) return; const id = ++fxSeq;
  ui.floats.push({ id, kind: 't', x: r.left + r.width / 2, y: r.top + r.height * 0.4, text, c });
  setTimeout(() => { const k = ui.floats.findIndex(f => f.id === id); if (k >= 0) ui.floats.splice(k, 1); }, 1150);
}
function burst(i) {

  for (let k = 0; k < 9; k++) { const id = ++fxSeq, a = k / 9 * 6.283; ui.floats.push({ id, kind: 'p', x: r.left + r.width / 2, y: r.top + r.height * 0.45, dx: Math.cos(a) * 60, dy: Math.sin(a) * 60 - 20 }); setTimeout(() => { const j = ui.floats.findIndex(f => f.id === id); if (j >= 0) ui.floats.splice(j, 1); }, 750); }
}

}
function learn(id) {

  g.learned.push(id);
  const first = !ui.lessons[id];
  if (first) { ui.lessons[id] = true; store.set('por2-lessons', ui.lessons); }
  const L = LESSONS[id];
  toast(L.fix, 'lesson', (L.good ? '✓ ' : '') + L.title + (first ? ' · new lesson' : ''));
}

/* ---------- simulation ---------- */
function update(dd) {
  const g = S.g, C = CONFIG; if (!g || g.over) return;
  g.day += dd;
  const env = envNow(g);
  if (g.heater > 0) {
    const cost = g.heater * C.economy.heaterCost * dd;
    if (g.cash >= cost) { g.cash -= cost; g.stats.energy += cost; }
    else { g.heater = 0; toast('Out of cash: the heater switched off.', 'bad'); log('Heater switched off (no cash).', 'bad'); }
  }
  stepCooker(g, dd);
  g.slots.forEach((v, i) => { if (v) stepVessel(g, v, dd, env, i); });
  stepLots(g, dd);
  if (g.day >= g.nextMarket) { g.nextMarket += C.economy.marketEvery; market(g, false); }
  stepEvents(g, dd);
  if (g.day >= C.time.seasonDays) endSeason('season');
  else if (g.cash < 1 && !g.lots.length && !g.dried && g.slots.every(v => !v || v.state === 'lost' || v.state === 'spent' || v.contam.vis > 0)) endSeason('broke');
}
const findV = (g, id) => g.slots.find(v => v && v.id === id);
function stepCooker(g, dd) {
  const ck = g.cooker, C = CONFIG.equipment;

    ck.batch = g.queue.splice(0, C.cookerCapacity); ck.t = 0;
    ck.batch.forEach(id => { const v = findV(g, id); if (v) v.state = 'cooking'; });
    SFX.hiss();
  }
  if (ck.batch.length) {
    ck.t += dd;
    if (ck.t >= C.cookerDays) {
      let n = 0; ck.batch.forEach(id => { const v = findV(g, id); if (v && v.state === 'cooking') { v.state = 'ready'; n++; } });
      ck.batch = []; ck.t = 0;
      if (n) { toast(`Pressure cooker done: ${n} sterile vessel${n > 1 ? 's' : ''} ready for spawn.`, 'good'); SFX.good(); }
    }
  }
}
function stepVessel(g, v, dd, env, i) {

  if (h > 0 && v.contam.onset == null && Math.random() < 1 - Math.exp(-h * dd)) { v.contam.onset = g.day; v.contam.why = causeOf(v, env); }
  if (v.contam.onset != null && g.day - v.contam.onset >= revealLag(v)) {
    if (v.contam.vis === 0) { v.contam.vis = 0.001; onMold(g, v, i); }
    v.contam.vis = Math.min(1, v.contam.vis + dd / C.contam.overrunDays);
    if (v.contam.vis >= 1) { v.lostFrom = v.state; v.state = 'lost'; log(`#${v.id} is overrun with mold. Toss it to free the shelf.`, 'bad'); }
    return; // growth stops once mold shows
  }
  const cf = colF(env.temp), G = C.growth;
  switch (v.kind + ':' + v.state) {
    case 'plate:colonizing': v.prog += dd / (G.plateDays / mediumSpeed(v.medium)) * cf; if (v.prog >= 1) { v.prog = 1; v.state = 'colonized'; v.uses = RULES.plateUses; SFX.pop(); } break;
    case 'jar:bath': case 'bag:bath': v.t += dd; if (v.t >= RULES.bathDays) { v.state = 'ready'; v.t = 0; } break;
    case 'jar:colonizing': v.prog += dd / G.jarDays * cf; if (v.prog >= 1) { v.prog = 1; v.state = 'colonized'; v.uses = RULES.jarUses; SFX.pop(); } break;
    case 'bag:colonizing': v.prog += dd / G.bagDays * cf; if (v.prog >= 1) { v.prog = 0; v.state = 'pinning'; v.flush = 1; v.stallT = 0; SFX.good(); float(i, 'Colonized!', 'good'); log(`#${v.id} fully colonized. Into fruiting.`); } break;

    case 'bag:overripe': v.t += dd; if (v.t >= G.peakWindow) { g.stats.dropped++; learn('overripe'); SFX.bad(); float(i, 'Dropped', 'bad'); log(`#${v.id}: the cluster collapsed before you picked it.`, 'bad'); ISF.track('death', { cause: 'overripe' }); afterFlush(v); } break;

function onMold(g, v, i) {

}
function sellAll(g) {

}

    const m = pool[Math.floor(Math.random() * pool.length)]; g.asked.push(m.s);

  }
}
function stepEvents(g, dd) {

    g.forecast = { start: g.day + 1 };

  }
  if (g.forecast && g.day >= g.forecast.start) { g.forecast = null; g.snap = { end: g.day + RULES.coldSnapDays }; toast('Cold snap! The room just lost ' + RULES.coldSnapDrop + '°F.', 'bad'); }
  if (g.snap && g.day >= g.snap.end) { g.snap = null; toast('The cold snap is over.'); }

}
function endSeason(reason) {

  const profit = g.cash - CONFIG.economy.startCash;
  ui.newBest = ui.best == null || profit > ui.best;
  if (ui.newBest) { ui.best = profit; store.set('por2-best', profit); }
  ISF.track('runEnd', { profit: Math.round(profit), day: Math.floor(g.day), reason, harvestKg: +g.stats.harvestKg.toFixed(2), lost: Object.values(g.stats.lost).reduce((a, b) => a + b, 0) });
  ui.sheet = null; ui.modal = null; ui.paused = false; ui.screen = 'report'; window.scrollTo({ top: 0 });
}

/* ---------- player actions ---------- */
function pay(cost) {
  const g = S.g; if (g.cash < cost) { toast(`Not enough cash (${money(cost)}).`, 'bad'); SFX.bad(); return false; }
  g.cash -= cost; g.stats.spent += cost; return true;
}
function place(i, v, msg) { S.g.slots[i] = v; ui.sheet = null; SFX.build(); log(msg); }
function pourPlate(i, medium) { if (!pay(CONFIG.economy.plateCost)) return; place(i, mk(S.g, 'plate', { medium }), `Poured a ${MEDIA[medium].name} plate on shelf ${i + 1}.`); }
function prepJar(i, prep) {
  if (!pay(CONFIG.economy.jarCost)) return;
  const v = mk(S.g, 'jar', { prep, state: prep === 'ster' ? 'queued' : 'bath' }); if (prep === 'ster') S.g.queue.push(v.id);
  place(i, v, `Grain jar #${v.id}: ${prep === 'ster' ? 'queued for the pressure cooker' : 'into the hot-water bath'}.`);
}
function prepBag(i, recipe, prep) {
  if (!pay(RECIPES[recipe].cost)) return;
  const v = mk(S.g, 'bag', { recipe, prep, state: prep === 'ster' ? 'queued' : 'bath' }); if (prep === 'ster') S.g.queue.push(v.id);
  place(i, v, `${RECIPES[recipe].name} bag #${v.id}: ${prep === 'ster' ? 'queued for the pressure cooker' : 'pasteurizing'}.`);
}
function sources(t) { const want = t.kind === 'jar' ? 'plate' : 'jar'; return S.g.slots.map((v, i) => ({ v, i })).filter(s => s.v && s.v.kind === want && s.v.state === 'colonized' && s.v.uses > 0); }
function tryInoculate(i) {
  const src = sources(S.g.slots[i]);
  if (src.length === 1 && !(src[0].v.contam.vis > 0)) inoculate(i, src[0].i); else openSheet(i);
}
function inoculate(ti, si) {
  const g = S.g, t = g.slots[ti], s = g.slots[si];
  t.state = 'colonizing'; t.prog = 0; t.parent = s.id; s.uses--;
  if (s.contam.onset != null) { t.contam.onset = g.day; t.contam.why = s.contam.vis > 0 ? 'expand_contam' : (s.medium === 'super' || s.contam.why === 'hidden_contam') ? 'hidden_contam' : s.contam.why; }
  if (s.medium === 'super') t.medium = 'super'; // remember the super-agar lineage for hidden-mold attribution
  SFX.build(); float(ti, 'Spawned!', 'good');
  log(`Spawned #${t.id} from #${s.id}${s.contam.vis > 0 ? ' (it had visible mold)' : ''}.`, s.contam.vis > 0 ? 'bad' : '');
  if (s.uses <= 0) { g.slots[si] = null; log(`#${s.id} is used up.`); }
  ui.sheet = null;
}
function toss(i) {
  const g = S.g, v = g.slots[i]; if (!v) return;
  g.queue = g.queue.filter(id => id !== v.id); g.cooker.batch = g.cooker.batch.filter(id => id !== v.id);
  g.slots[i] = null; ui.sheet = null; SFX.tap(); log(`Tossed #${v.id} ${vName(v)}.`);
}
function cutEdge(i) {
  const v = S.g.slots[i]; if (!pay(CONFIG.economy.plateCost)) return;
  v.contam = { onset: null, vis: 0, why: null }; v.prog = 0.3; v.state = 'colonizing'; v.uses = 0;
  S.g.stats.rescued++; learn('agar_job'); SFX.good(); float(i, 'Rescued!', 'good'); log(`Cut a clean edge from #${v.id} onto a fresh plate.`, 'good'); ui.sheet = null;
}
const canShake = v => v.kind === 'jar' && v.state === 'colonizing' && !v.shaken && v.prog >= RULES.shakeFrom && v.prog <= RULES.shakeTo && !(v.contam.vis > 0);
function shake(i) { const v = S.g.slots[i]; v.shaken = true; v.prog += (1 - v.prog) * CONFIG.growth.shakeBoost; learn('shake'); SFX.shake(); wobble(i); float(i, 'Shaken!'); ui.sheet = null; }
function harvest(i) {
  const g = S.g, v = g.slots[i];
  const stage = v.state === 'peak' ? 'peak' : v.state === 'overripe' ? 'overripe' : 'young';
  const qc = v.q.n ? v.q.c / v.q.n : 1, qh = v.q.n ? v.q.h / v.q.n : 1, qual = clamp(qc * qh, 0.25, 1);

  g.lots.push({ kg, age: 0, id: ++g.lotSeq }); g.stats.harvestKg += kg;
  if (qc < 0.8) learn('leggy');
  if (qh < 0.8) learn('dry_caps');
  if (v.flush >= 3) learn('flush3');
  SFX.harvest(); float(i, '+' + kg.toFixed(2) + ' kg'); burst(i);
  log(`Picked ${kg.toFixed(2)} kg from #${v.id} (flush ${v.flush}, ${stage}${qual < 0.95 ? ', quality ' + Math.round(qual * 100) + '%' : ''}).`, 'good');
  afterFlush(v); ui.sheet = null;
}
function soak(i) { const v = S.g.slots[i]; v.state = 'resting'; v.t = 0; ui.sheet = null; SFX.tap(); log(`Soaking #${v.id} for a third flush.`); }
function retire(i) { const v = S.g.slots[i]; S.g.slots[i] = null; ui.sheet = null; SFX.tap(); log(`Retired #${v.id} after ${v.flush} flush${v.flush === 1 ? '' : 'es'}.`); }
function dryAll() {
  const g = S.g, kg = g.lots.reduce((a, l) => a + l.kg, 0); if (!kg) return;
  g.dried += kg; g.lots = []; SFX.good(); learn('dry_save'); log(`Dehydrated ${kg.toFixed(2)} kg.`, 'good'); toast(`Dried ${kg.toFixed(2)} kg. It keeps all season.`);
}
function openSheet(i) { ui.sheet = { slot: i }; }

/* ---------- views ---------- */
function vName(v) { return v.kind === 'plate' ? MEDIA[v.medium].name + ' plate' : v.kind === 'jar' ? 'Grain jar' : RECIPES[v.recipe].short + (isBlock(v) ? ' block' : ' bag'); }
function fruitImg(v, st) {
  const qc = v.q.n ? v.q.c / v.q.n : 1, qh = v.q.n ? v.q.h / v.q.n : 1;
  if (st === 'pinning') return v.prog < 0.5 ? 'block_ready' : 'block_pins';

  else if (FRUIT.includes(st)) add(fruitImg(v, st), st === 'growing' ? { transform: `scale(${(0.88 + 0.12 * v.prog).toFixed(3)})` } : {});
  else { add(RECIPES[v.recipe].img); if (st === 'colonizing' && v.prog > 0) add('bag_colonized', revealStyle('bag_colonized', v.prog)); }
  if (v.contam.vis > 0) add('mold_overlay', { opacity: (0.3 + 0.7 * v.contam.vis).toFixed(2), transform: `scaleX(${v.id % 2 ? -1 : 1}) rotate(${(v.id * 37) % 40 - 20}deg) scale(${(0.7 + 0.4 * v.contam.vis).toFixed(2)})`, transformOrigin: '50% 60%' });

}
function status(v) {
  const g = S.g, pct = Math.round(v.prog * 100);

    case 'colonizing': return (canShake(v) ? 'Shake me · ' : 'Colonizing ') + pct + '%';
    case 'colonized': return `Ready · ${v.uses} use${v.uses > 1 ? 's' : ''}`;
    case 'pinning': return envNow(g).temp < 64 ? 'Too cold!' : 'Pinning ' + pct + '%';

function barPct(v) {

  if (v.state === 'cooking') return S.g.cooker.t / CONFIG.equipment.cookerDays * 100;
  if (v.state === 'bath') return v.t / RULES.bathDays * 100;
  if (v.state === 'peak' || v.state === 'overripe') return Math.max(0, 100 - v.t / CONFIG.growth.peakWindow * 100);
  if (v.state === 'resting') return v.t / CONFIG.growth.restDays * 100;
  if (['ready', 'queued', 'spent'].includes(v.state)) return 0;
  return v.prog * 100;
}
function barColor(v) { return v.contam.vis > 0 ? 'var(--bad)' : v.state === 'overripe' ? 'var(--warn)' : v.state === 'peak' ? 'var(--good)' : 'var(--pink)'; }
function slotCls(v) {
  if (!v) return '';
  if (v.state === 'lost') return 'lost attn-mold';
  if (v.contam.vis > 0) return 'attn-mold';
  if (v.state === 'overripe') return 'attn-urgent';
  if (v.state === 'peak') return 'attn-harvest';
  if (v.state === 'ready' && sources(v).length) return 'attn-ready';
  if (v.state === 'pinning' && envNow(S.g).temp < 64) return 'attn-warn';
  if (canShake(v)) return 'attn-ready';
  return '';
}

/* ---------- coaching line: first thing worth doing ---------- */
function tipFor(g) {
  const env = envNow(g), V = g.slots.map((v, i) => ({ v, i })).filter(s => s.v);
  const f = p => V.find(s => p(s.v));
  const T = (t, o = {}) => ({ t, ...o });
  let s;
  if ((s = f(v => v.state === 'lost'))) return T(`#${s.v.id} is overrun. Tap it to toss it and free the shelf.`, { slot: s.i });
  if ((s = f(v => v.contam.vis > 0))) return T(`Mold on #${s.v.id}. ${s.v.kind === 'plate' ? 'Cut a clean edge onto a fresh plate, or toss it.' : 'It won’t recover: toss it, and never spawn from it.'}`, { slot: s.i });
  if ((s = f(v => v.state === 'overripe'))) return T(`#${s.v.id} is over-ripening. Pick it now before it drops.`, { slot: s.i });
  if ((s = f(v => v.state === 'peak'))) return T(`#${s.v.id} is at peak. Tap it to harvest.`, { slot: s.i });
  if ((s = f(v => v.state === 'pinning')) && env.temp < 64) return T(`#${s.v.id} won’t pin at ${env.temp}°F. Pinks need 70–85°F: turn the heater up.`, { heat: true });
  const fresh = g.lots.reduce((a, l) => a + l.kg, 0);
  if (fresh && g.lots.some(l => l.age + (g.nextMarket - g.day) > CONFIG.economy.shelfLife)) return T(`Some fresh pinks won’t last until market day. Dehydrate them (D) or lose them.`, { dry: true });
  if (f(v => isBlock(v) && ['pinning', 'growing'].includes(v.state))) {
    if (env.co2 > 1000) return T(`CO₂ is ${env.co2} ppm: clusters will go leggy. Add fresh air.`, { room: true });
    if (env.rh < 85) return T(`Humidity is ${env.rh}%: caps will crack. Turn up the mist.`, { room: true });
    if (env.rh > 96) return T(`Humidity is ${env.rh}%: bacteria love that. Ease off the mist.`, { room: true });
    if (env.temp < 70) return T(`${env.temp}°F is cool: pinning is slow. More heat speeds it up.`, { heat: true });
  }
  if ((s = f(v => v.state === 'ready' && sources(v).length))) return T(`#${s.v.id} is ${s.v.prep === 'ster' ? 'sterile' : 'pasteurized'} and ready. Tap it to spawn into it.`, { slot: s.i });
  if ((s = f(v => canShake(v)))) return T(`Jar #${s.v.id} is about a third colonized. Tap to break and shake it.`, { slot: s.i });
  if ((s = f(v => v.kind === 'jar' && v.state === 'ready'))) return T(`Jar #${s.v.id} needs a culture. Pour a plate on an empty shelf.`);
  if ((s = f(v => v.kind === 'bag' && v.state === 'ready'))) return T(`Bag #${s.v.id} needs grain spawn. Prep and colonize a grain jar.`);
  const e = g.slots.findIndex(v => !v);
  if (e >= 0) return T(`Empty shelf. Tap it to pour a plate, prep a jar, or prep a substrate bag.`, { slot: e });
  return T(`Market in ${(g.nextMarket - g.day).toFixed(1)} days. Keep the room warm, fresh and humid.`);
}

/* ============================== APP ============================== */
function start() {
  SFX.unlock(); S.g = newGame(); ui.screen = 'play'; ui.sheet = null; ui.modal = null; ui.paused = false; ui.autoPaused = false; ui.newBest = false;
  ISF.track('runStart'); window.scrollTo({ top: 0 });
  log('A new season. The spare room is chilly.');
}
function closeSheet() { ui.sheet = null; }
const App = {
  template: '#tpl',
  data() { return { ui, S, CONFIG, manifest, RULES, GUIDE, NUMS, PREP, MYTHS, LESSONS, LESSON_IDS, RECIPES, BUYABLE, MEDIA, NB_TABS }; },
  computed: {
    g() { return S.g; },
    env() { return envNow(S.g); },
    baseTemp() { return baseTemp(S.g); },
    tS() { return tStat(this.env.temp); }, cS() { return cStat(this.env.co2); }, hS() { return hStat(this.env.rh); },
    marketIn() { return Math.max(0, S.g.nextMarket - S.g.day); },
    freshKg() { return S.g.lots.reduce((a, l) => a + l.kg, 0); },
    tip() { return tipFor(S.g); },
    sv() { return ui.sheet ? S.g.slots[ui.sheet.slot] : null; },
    sheetTitle() { const v = this.sv; return v ? vName(v) : 'Empty shelf'; },
    sheetImg() { const v = this.sv; if (!v) return 'plate_empty'; return layers(v).filter(l => l.id !== 'mold_overlay').pop().id; },
    sheetGuide() { const v = this.sv; if (!v) return null; const id = v.kind === 'plate' ? 'agar' : v.kind === 'jar' ? 'grain' : isBlock(v) ? 'fruit' : 'sub'; return GUIDE.find(x => x.id === id); },
    sheetFacts() {
      const v = this.sv, out = [['Status', status(v)]];
      if (v.kind === 'plate') out.push(['Medium', MEDIA[v.medium].name]);
      if (v.kind !== 'plate') out.push(['Prep', v.prep === 'ster' ? 'Sterilized' : 'Pasteurized']);
      if (v.kind === 'bag') out.push(['Substrate', RECIPES[v.recipe].name]);
      if (v.state === 'colonizing') out.push(['Colonized', Math.round(v.prog * 100) + '%']);
      if (isBlock(v)) out.push(['Flush', String(v.flush)]);
      out.push(['Mold', v.contam.vis > 0 ? 'Visible!' : 'None visible']);
      return out;
    },
    sheetNote() {
      const v = this.sv; if (!v) return '';
      if (v.state === 'colonized') return v.kind === 'plate' ? 'Tap a ready grain jar to spawn from this plate.' : 'Tap a ready substrate bag to spawn from this jar.';
      if (v.state === 'pinning' && this.env.temp < 64) return 'Pinks won’t pin below ~64°F. Warm the room.';
      if (v.state === 'queued') return 'Waiting for the pressure cooker to finish its current batch.';
      return '';
    },
    cookerLine() { const g = S.g; return `${g.cooker.batch.length}/${CONFIG.equipment.cookerCapacity} cooking, ${g.queue.length} queued`; },
    nbGuide() { return GUIDE.find(x => x.id === ui.nbStage) || GUIDE[0]; },
    lessonCount() { return LESSON_IDS.filter(id => ui.lessons[id]).length; },
    artFound() { return manifest.images.filter(m => manifest.status[m.id] === 'loaded').length; },
    profit() { return S.g.cash - CONFIG.economy.startCash; },
    lostTotal() { return Object.values(S.g.stats.lost).reduce((a, b) => a + b, 0); },
    rank() {
      const r = this.profit / CONFIG.economy.targetProfit;
      if (r >= 1) return ['Pleurotus Whisperer', 'Clean technique, a warm room and fast sales. This is a market-table operation.'];
      if (r >= 0.6) return ['Flush Master', 'A solid season with a couple of costly habits. Fix the rows below and you’re top tier.'];
      if (r >= 0.25) return ['Grain Jar Apprentice', 'You can grow mycelium. Contamination, conditions or timing still cost you.'];
      return ['Spore Tourist', 'The mushrooms weren’t the problem. Read the lessons below, then try another season.'];
    },
  },
  methods: {
    src, money, start, layers, status, badge, barPct, barColor, vName, isBlock, canShake, sources,
    pourPlate, prepJar, prepBag, inoculate, toss, cutEdge, shake, harvest, soak, retire, dryAll, closeSheet,
    slotCls(v) { return slotCls(v); },
    slotAria(v, i) { return `Shelf ${i + 1}: ` + (v ? `#${v.id} ${vName(v)}, ${status(v)}` : 'empty'); },
    plateDaysFor(k) { return +(CONFIG.growth.plateDays / mediumSpeed(k)).toFixed(1); },
    lotCls(l) { const left = CONFIG.economy.shelfLife - l.age; return left < 0.6 ? 'dying' : left < 1.2 ? 'old' : ''; },
    guideName(id) { const x = GUIDE.find(s => s.id === id); return x ? x.name : id; },
    dbg(v) { const e = envNow(S.g); return `h=${hazard(v, e).toFixed(3)} on=${v.contam.onset == null ? '-' : v.contam.onset.toFixed(1)}\n${v.contam.why || ''} st=${v.state} t=${v.t.toFixed(2)}`; },
    tapSlot(i) {
      SFX.unlock(); const v = S.g.slots[i];
      if (!v) return openSheet(i);
      if (v.state === 'lost') return toss(i);
      if (v.contam.vis > 0) return openSheet(i);
      if (v.state === 'peak' || v.state === 'overripe') return harvest(i);
      if (v.state === 'ready') return tryInoculate(i);
      if (canShake(v)) return shake(i);
      SFX.tap(); openSheet(i);
    },
    setHeater(h) { S.g.heater = h; SFX.tap(); },
    doTip() {
      const t = this.tip; SFX.unlock();
      if (t.slot != null) return this.tapSlot(t.slot);
      if (t.dry) return dryAll();
      if (t.heat) { if (S.g.heater < 2) this.setHeater(S.g.heater + 1); return; }
      if (t.room) { const el = document.getElementById('room'); el && el.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'center' }); }
    },
    togglePause() { ui.paused = !ui.paused; },
    resume() { ui.paused = false; ui.autoPaused = false; SFX.unlock(); },
    quit() { ui.paused = false; ui.autoPaused = false; endSeason('season'); },
    toggleMute() { ui.muted = !ui.muted; store.set('por2-mute', ui.muted); SFX.unlock(); },
    openNb(tab) { if (tab) ui.nbTab = tab; ui.notebook = true; },
    closeModal() { ui.modal = null; },
    answer(v) { const m = ui.modal; m.ans = v; if (v === m.m.a) { S.g.cash += RULES.quizTip; S.g.stats.revenue += RULES.quizTip; SFX.coin(); } else SFX.bad(); },
    coffee(yes) {
      const g = S.g, i = g.slots.findIndex(v => !v); ui.modal = null;
      if (yes && i >= 0) place(i, mk(g, 'bag', { recipe: 'coffee', prep: 'past', state: 'bath' }), `Bagged the neighbor’s week-old coffee grounds on shelf ${i + 1}.`);
      else log('Declined the week-old coffee grounds. Good instinct: they’re already moldy.', 'good');
    },
  },
};
Vue.createApp(App).mount('#app');

/* ============================== LOOP, INPUT, LIFECYCLE ============================== */
const menuPause = () => ui.notebook || !!ui.modal || (ui.sheet && CONFIG.time.pauseInMenus);
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 20) * CONFIG.dev.timeScale; last = now;
  if (ui.screen === 'play' && S.g && !CONFIG.dev.paused && !ui.paused && !ui.autoPaused && !menuPause()) update(dt / CONFIG.time.secondsPerDay);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
const autoPause = () => { if (ui.screen === 'play') ui.autoPaused = true; };
document.addEventListener('visibilitychange', () => { if (document.hidden) autoPause(); });
window.addEventListener('blur', autoPause);
window.addEventListener('pointerdown', () => SFX.unlock(), { capture: true });
window.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if (e.key === 'Escape') { if (ui.sheet) ui.sheet = null; else if (ui.notebook) ui.notebook = false; else if (ui.modal && ui.modal.type === 'quiz' && ui.modal.ans !== null) ui.modal = null; return; }
  if (ui.screen !== 'play' || ['INPUT', 'TEXTAREA', 'SELECT'].includes(tag)) return;
  if (e.key === ' ') { e.preventDefault(); if (ui.autoPaused) { ui.autoPaused = false; ui.paused = false; } else ui.paused = !ui.paused; return; }
  if (ui.modal || ui.sheet || ui.notebook) return;
  const n = '123456789'.indexOf(e.key);
  if (n >= 0 && n < S.g.slots.length) { e.preventDefault(); App.methods.tapSlot(n); return; }
  const k = e.key.toLowerCase();
  if (k === 'd') dryAll(); else if (k === 'h') App.methods.setHeater((S.g.heater + 1) % 3); else if (k === 'n') ui.notebook = true; else if (k === 'm') App.methods.toggleMute();
});

/* ============================== ADMIN HOOKS ============================== */
ISF.onRestart(() => { if (ui.screen !== 'title') start(); });
ISF.action('Skip 5 days', () => { if (S.g && ui.screen === 'play') for (let k = 0; k < 100; k++) update(0.05); });
ISF.action('Mold on a shelf', () => { const v = S.g && S.g.slots.find(x => x && x.state !== 'lost' && x.contam.onset == null); if (v) { v.contam.onset = S.g.day - 99; v.contam.why = 'luck'; } });
ISF.action('+ $50', () => { if (S.g) S.g.cash += 50; });
ISF.action('Image check', () => { const miss = manifest.images.filter(m => manifest.status[m.id] !== 'loaded').map(m => m.file); console.table(manifest.images.map(m => ({ id: m.id, file: m.file, status: manifest.status[m.id] }))); toast(`${manifest.images.length - miss.length}/${manifest.images.length} custom images found. Details in the Notebook > Art tab.`); });
</script>
</body>
