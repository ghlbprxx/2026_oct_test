<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Times Table Dash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Pixelify+Sans:wght@500;700&family=Nunito:wght@600;700;800;900&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/practice.css">
<link rel="stylesheet" href="css/story.css">
<link rel="stylesheet" href="css/cheat.css">
</head>
<body>
<div id="app"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<noscript><div class="boot-error"><strong>This game needs JavaScript.</strong></div></noscript>

<script src="https://unpkg.com/vue@3.4.21/dist/vue.global.prod.js"></script>
<script>
  // Shown if Vue can't load, or if the page is opened from disk (modules need a web server).
  window.addEventListener('load', function () {
    setTimeout(function () {
      var app = document.getElementById('app');
      if (app && !app.children.length) {
        app.outerHTML = '<div class="boot-error"><strong>The game could not load.</strong> ' +
          (location.protocol === 'file:' ? 'Open it through a web server, for example <code>python3 -m http.server</code>, not straight from disk.' : 'Check your internet connection and reload the page.') + '</div>';
      }
    }, 1500);
  });
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
